<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arsenal Player Flashcards</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .card {
            border: 2px solid #ef0107;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
            background: #fff;
        }
        .player-image {
            width: 200px;
            height: 200px;
            background-color: #ddd;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            border-radius: 5px;
            object-fit: cover;
        }
        select, button {
            padding: 10px 15px;
            font-size: 16px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
        }
        button {
            background-color: #ef0107;
            color: white;
            border: none;
        }
        button:hover {
            background-color: #c70005;
        }
        .scoreboard {
            margin-top: 20px;
            text-align: left;
            background: #f9f9f9;
            padding: 15px;
            border-radius: 5px;
        }
        .feedback {
            font-weight: bold;
            margin: 10px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <p>⚽ Home</p>
    <h1>Arsenal Quiz</h1>
    <p>Player Flashcards | Matchday Challenge | Test Your Knowledge</p>
    
    <h2>Who Is The Player?</h2>
    <p>Study the face. Choose the correct Arsenal player.</p>

    <div class="card">
        <!-- Replace text with <img id="player-img" src="path_to_image.jpg"> when you have images -->
        <div id="player-view" class="player-image">Current Player</div>
        <h3>Who is the Arsenal player shown below?</h3>
        
        <select id="player-select">
            <option value="">-- Select a Player --</option>
            <option value="Saka">Bukayo Saka</option>
            <option value="Odegaard">Martin Ødegaard</option>
            <option value="Saliba">William Saliba</option>
            <option value="Rice">Declan Rice</option>
        </select>
        <br><br>
        
        <button id="submit-btn">✓ Submit Answer</button>
        <button id="next-btn" disabled>Next Player →</button>
        <div id="feedback" class="feedback"></div>
    </div>

    <div class="scoreboard">
        <h3>Your Score ★ <span id="score-star">0</span></h3>
        <p><strong>Correct Answers:</strong> <span id="correct-count">0</span></p>
        <p><strong>Attempts:</strong> <span id="attempts-count">0</span></p>
        <p><strong>Accuracy:</strong> <span id="accuracy-rate">0%</span></p>
        <p><strong>Quiz Progress:</strong> <span id="quiz-progress">0%</span></p>
    </div>
</div>

<script>
    // Quiz Data
    const players = [
        { name: "Saka", placeholder: "Bukayo Saka Face Pic" },
        { name: "Odegaard", placeholder: "Martin Ødegaard Face Pic" },
        { name: "Saliba", placeholder: "William Saliba Face Pic" },
        { name: "Rice", placeholder: "Declan Rice Face Pic" }
    ];

    let currentIndex = 0;
    let correctAnswers = 0;
    let totalAttempts = 0;
    let hasAnsweredCurrent = false;

    // DOM Elements
    const playerView = document.getElementById("player-view");
    const playerSelect = document.getElementById("player-select");
    const submitBtn = document.getElementById("submit-btn");
    const nextBtn = document.getElementById("next-btn");
    const feedback = document.getElementById("feedback");
    
    const scoreStar = document.getElementById("score-star");
    const correctCount = document.getElementById("correct-count");
    const attemptsCount = document.getElementById("attempts-count");
    const accuracyRate = document.getElementById("accuracy-rate");
    const quizProgress = document.getElementById("quiz-progress");

    // Initialize Quiz
    function loadPlayer() {
        playerView.textContent = players[currentIndex].placeholder;
        playerSelect.value = "";
        feedback.textContent = "";
        submitBtn.disabled = false;
        nextBtn.disabled = true;
        hasAnsweredCurrent = false;
        updateScoreboard();
    }

    function updateScoreboard() {
        correctCount.textContent = correctAnswers;
        attemptsCount.textContent = totalAttempts;
        scoreStar.textContent = correctAnswers;
        
        // Calculate Accuracy
        const accuracy = totalAttempts > 0 ? Math.round((correctAnswers / totalAttempts) * 100) : 0;
        accuracyRate.textContent = accuracy + "%";
        
        // Calculate Progress
        const progress = Math.round((currentIndex / players.length) * 100);
        quizProgress.textContent = progress + "%";
    }

    // Event Listeners
    submitBtn.addEventListener("click", () => {
        const selectedAnswer = playerSelect.value;
        if (!selectedAnswer) {
            feedback.textContent = "Please select a player first!";
            feedback.style.color = "orange";
            return;
        }

        if (hasAnsweredCurrent) return;

        totalAttempts++;
        hasAnsweredCurrent = true;

        if (selectedAnswer === players[currentIndex].name) {
            correctAnswers++;
            feedback.textContent = "Correct! Well done.";
            feedback.style.color = "green";
        } else {
            feedback.textContent = `Incorrect! It was ${players[currentIndex].placeholder.split(' ')[0]}.`;
            feedback.style.color = "red";
        }

        submitBtn.disabled = true;
        nextBtn.disabled = false;
        updateScoreboard();
    });

    nextBtn.addEventListener("click", () => {
        currentIndex++;
        if (currentIndex < players.length) {
            loadPlayer();
        } else {
            // End of Quiz
            playerView.textContent = "Quiz Complete!";
            playerSelect.style.display = "none";
            submitBtn.style.display = "none";
            nextBtn.style.display = "none";
            feedback.textContent = `Final Score: ${correctAnswers} out of ${players.length}!`;
            feedback.style.color = "blue";
            quizProgress.textContent = "100%";
        }
    });

    // Run on boot
    loadPlayer();
</script>

</body>
</html>
