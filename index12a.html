<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arsenal Player Flashcards</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: url('6a4ff4760d36b823e2c295ab24f2d191.png');
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
              background: url('6a4ff4760d36b823e2c295ab24f2d191.png');
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            
        }
        .card {
            border: 2px solid #ef0107;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
            background: #fff;
        }
        .player-image-container {
            width: 250px;
            height: 250px;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #eee;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #ddd;
        }
        .player-image-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        select, button {
            padding: 10px 15px;
            font-size: 16px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
        }
        button {
            background-color: #ef0107;
            color: white;
            border: none;
        }
        button:hover {
            background-color: #c70005;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .scoreboard {
            margin-top: 20px;
            text-align: left;
            background: #f9f9f9;
            padding: 15px;
            border-radius: 5px;
        }
        .feedback {
            font-weight: bold;
            margin: 10px 0;
            font-size: 18px;
        }
    </style>
</head>
<body>

<div class="container">
    <p>
    <a href=" https://janicej637.github.io/" style="color: #000080;"><img src="https://clipart-library.com/data_images/469756.png" alt="Home" width="80" height="30"> </a>
  </p>
 <div class="card">
    <h1>Arsenal Player Flashcards</h1>
    <p>Test Your Knowledge</p>
    
  
   
 </div>
    <div class="card">
        <div class="player-image-container">
            <!-- Image tag dynamically populated by JavaScript web URLs -->
            <img id="player-img" src="" alt="Arsenal Player Face">
        </div>
        <h3>Who is the Arsenal player?</h3>
        
        <select id="player-select">
            <option value="">-- Select a Player --</option>
            <option value="Saka">Bukayo Saka</option>
            <option value="Odegaard">Martin Ødegaard</option>
            <option value="Saliba">William Saliba</option>
            <option value="Rice">Declan Rice</option>
            <option value="Havertz">Kai Havertz</option>
        </select>
        <br><br>
        
        <button id="submit-btn">✓ Submit Answer</button>
        <button id="next-btn" disabled>Next Player →</button>
        <div id="feedback" class="feedback"></div>
    </div>

    <div class="scoreboard">
        <h3>Your Score ★ <span id="score-star">0</span></h3>
        <p><strong>Correct Answers:</strong> <span id="correct-count">0</span></p>
        <p><strong>Attempts:</strong> <span id="attempts-count">0</span></p>
        <p><strong>Accuracy:</strong> <span id="accuracy-rate">0%</span></p>
        <p><strong>Quiz Progress:</strong> <span id="quiz-progress">0%</span></p>
    </div>
</div>

<script>
    // Quiz Data utilizing web URLs for images
    const players = [
  
 
    { id: "Raya", displayName: "David Raya", imgUrl: "https://commons.wikimedia.org/wiki/Special:Redirect/file/David_Raya_Argentina_v_Spain_19_July_2026-003_(cropped).jpg" },
    { id: "Saliba", displayName: "William Saliba", imgUrl: "https://commons.wikimedia.org/wiki/Special:Redirect/file/1_william_saliba_arsenal_2025_(cropped).jpg" },
    { id: "Gabriel", displayName: "Gabriel Magalhaes", imgUrl: "https://commons.wikimedia.org/wiki/Special:Redirect/file/1_Gabriel_Magalhães_2026_(cropped).jpg" },
    { id: "Timber", displayName: "Jurrien Timber", imgUrl: "https://cdn1.arsenalinsider.com/uploads/19/2024/03/GettyImages-1593911047-1024x683.jpg" },
    { id: "Hincapie", displayName: "Piero Hincapie", imgUrl: "https://commons.wikimedia.org/wiki/Special:Redirect/file/1_Piero_Hincapié_2026.jpg" },
    { id: "Calafiori", displayName: "Riccardo Calafiori", imgUrl: "https://commons.wikimedia.org/wiki/Special:Redirect/file/1_Riccardo_Calafiori_2026.jpg" },
    { id: "Rice", displayName: "Declan Rice", imgUrl: "https://commons.wikimedia.org/wiki/Special:Redirect/file/Declan_Rice_England_v_Ghana_23_June_2026-143.jpg" },
    { id: "Zubimendi", displayName: "Martin Zubimendi", imgUrl: "https://commons.wikimedia.org/wiki/Special:Redirect/file/1_Martín_Zubimendi_arsenal_2025.jpg" },
    { id: "Odegaard", displayName: "Martin Odegaard", imgUrl: "https://commons.wikimedia.org/wiki/Special:Redirect/file/Martin_Odegaard_France_v_Norway_26_June_26-011.jpg" },
    { id: "Eze", displayName: "Eberechi Eze", imgUrl: "https://commons.wikimedia.org/wiki/Special:Redirect/file/1_Eberechi_Eze_2026.jpg" },
    { id: "Saka", displayName: "Bukayo Saka", imgUrl: "https://commons.wikimedia.org/wiki/Special:Redirect/file/1_bukayo_saka_arsenal_2025_(cropped).jpg" },
    { id: "Madueke", displayName: "Noni Madueke", imgUrl: "https://eu-images.contentstack.com/v3/assets/blta90d05ad41a54a71/blt25abd0f334adba28/6893b0047c09c25f3cf57518/Noni_Madueke_Arsenal.jpg" },
    { id: "Martinelli", displayName: "Gabriel Martinelli", imgUrl: "https://commons.wikimedia.org/wiki/Special:Redirect/file/Gabriel_Martinelli_Brazil_V_Morocco_13_June_2026-144.jpg" },
    { id: "Gyokeres", displayName: "Viktor Gyokeres", imgUrl: "https://commons.wikimedia.org/wiki/Special:Redirect/file/1_Viktor_Gyökeres_2026.jpg" },
    { id: "Tzolis", displayName: "Christos Tzolis", imgUrl: "https://commons.wikimedia.org/wiki/Special:Redirect/file/Sweden_-_Greece22_(cropped).jpg" },
    { id: "Guimaraes", displayName: "Bruno Guimaraes", imgUrl: "https://commons.wikimedia.org/wiki/Special:Redirect/file/Bruno_Guimarães_24052026_(1).jpg" }


];

    

    let currentIndex = 0;
    let correctAnswers = 0;
    let totalAttempts = 0;
    let hasAnsweredCurrent = false;

    // DOM Elements
    const playerImg = document.getElementById("player-img");
    const playerSelect = document.getElementById("player-select");
    const submitBtn = document.getElementById("submit-btn");
    const nextBtn = document.getElementById("next-btn");
    const feedback = document.getElementById("feedback");
    
    const scoreStar = document.getElementById("score-star");
    const correctCount = document.getElementById("correct-count");
    const attemptsCount = document.getElementById("attempts-count");
    const accuracyRate = document.getElementById("accuracy-rate");
    const quizProgress = document.getElementById("quiz-progress");

    // Initialize/Load Card
    function loadPlayer() {
        playerImg.src = players[currentIndex].imgUrl;
        playerSelect.value = "";
        feedback.textContent = "";
        submitBtn.disabled = false;
        nextBtn.disabled = true;
        hasAnsweredCurrent = false;
        updateScoreboard();
    }

    function updateScoreboard() {
        correctCount.textContent = correctAnswers;
        attemptsCount.textContent = totalAttempts;
        scoreStar.textContent = correctAnswers;
        
        // Calculate Accuracy
        const accuracy = totalAttempts > 0 ? Math.round((correctAnswers / totalAttempts) * 100) : 0;
        accuracyRate.textContent = accuracy + "%";
        
        // Calculate Progress
        const progress = Math.round((currentIndex / players.length) * 100);
        quizProgress.textContent = progress + "%";
    }

    // Event Listener for Answer Submission
    submitBtn.addEventListener("click", () => {
        const selectedAnswer = playerSelect.value;
        if (!selectedAnswer) {
            feedback.textContent = "⚠️ Please select a player first!";
            feedback.style.color = "orange";
            return;
        }

        if (hasAnsweredCurrent) return;

        totalAttempts++;
        hasAnsweredCurrent = true;

        if (selectedAnswer === players[currentIndex].id) {
            correctAnswers++;
            feedback.textContent = "🎉 Correct! Well done.";
            feedback.style.color = "green";
        } else {
            feedback.textContent = `❌ Incorrect! It was ${players[currentIndex].displayName}.`;
            feedback.style.color = "red";
        }

        submitBtn.disabled = true;
        nextBtn.disabled = false;
        updateScoreboard();
    });

    // Event Listener for Next Button
    nextBtn.addEventListener("click", () => {
        currentIndex++;
        if (currentIndex < players.length) {
            loadPlayer();
        } else {
            // End of Quiz
            playerImg.src = "https://wikimedia.org"; 
            playerSelect.style.display = "none";
            submitBtn.style.display = "none";
            nextBtn.style.display = "none";
            feedback.textContent = `🏆 Quiz Complete! Final Score: ${correctAnswers} out of ${players.length}!`;
            feedback.style.color = "blue";
            quizProgress.textContent = "100%";
            updateScoreboard();
        }
    });

    // Run on boot
    loadPlayer();
</script>

</body>
</html>
