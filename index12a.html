/* ============================================================
   GENERATE FOUR RADIO-BUTTON ANSWERS
   ============================================================ */

function getAnswerChoices(correctPlayer) {

    const choices = [correctPlayer.name];

    const otherPlayers = players.filter(
        player => player.name !== correctPlayer.name
    );

    // Shuffle the other players
    const shuffled = [...otherPlayers].sort(
        () => Math.random() - 0.5
    );

    // Add three incorrect answers
    for (let i = 0; i < shuffled.length && choices.length < 4; i++) {
        choices.push(shuffled[i].name);
    }

    // Shuffle all four answers
    return choices.sort(() => Math.random() - 0.5);
}


/* ============================================================
   CREATE QUESTION DATA
   ============================================================ */

function createQuestion(player) {

    return {
        player: player,
        question: `Who is this Arsenal player?`,
        choices: getAnswerChoices(player),
        correctAnswer: player.name
    };

}


/* ============================================================
   SHUFFLE PLAYERS
   ============================================================ */

function shufflePlayers() {

    return [...players].sort(
        () => Math.random() - 0.5
    );

}

function getPlayerByName(name) {

    return players.find(
        player => player.name === name
    );

}


function getPlayersByPosition(position) {

    return players.filter(
        player => player.position.includes(position)
    );

}


function getRandomPlayer() {

    return players[
        Math.floor(Math.random() * players.length)
    ];

}
