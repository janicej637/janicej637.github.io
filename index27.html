<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realistic 3D Character Studio</title>
    <!-- Tailwind CSS Engine -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #05070f;
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        #container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        /* Custom Premium Overrides for lil-gui mapping */
        .lil-gui {
            --background-color: rgba(15, 23, 42, 0.75) !important;
            --text-color: #e2e8f0 !important;
            --title-background-color: rgba(30, 41, 59, 0.9) !important;
            --widget-color: #334155 !important;
            --hover-color: #475569 !important;
            --focus-color: #6366f1 !important;
            --number-color: #38bdf8 !important;
            --string-color: #34d399 !important;
            font-family: monospace !important;
            border-radius: 12px !important;
            overflow: hidden !important;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.5), 0 8px 10px -6px rgb(0 0 0 / 0.5) !important;
            border: 1px solid rgba(255, 255, 255, 0.05) !important;
            backdrop-filter: blur(12px) !important;
        }
        .lil-gui .title { font-weight: 700 !important; letter-spacing: 0.05em !important; }
    </style>
</head>
<body>

    <div id="container"></div>

    <!-- Sleek Minimalist Top HUD Overlay -->
    <div class="absolute top-6 left-6 z-10 pointer-events-none flex flex-col gap-2">
        <header class="pointer-events-auto bg-slate-950/70 backdrop-blur-xl border border-white/5 rounded-xl px-5 py-3 shadow-2xl max-w-xs">
            <h1 class="text-white font-bold tracking-wider text-xs uppercase">Character Studio</h1>
            <p class="text-slate-400 text-[10px] tracking-widest mt-0.5 uppercase">PBR Rendering Core v2.0</p>
        </header>
    </div>

    <!-- Import Map Mapping Infrastructure -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com",
                "three/addons/": "https://unpkg.com"
            }
        }
    </script>

    <!-- Run Logic System File -->
    <script type="module" src="./avatar2.js"></script>
</body>
</html>
