<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Test your knowledge with Flag Flashcards game.">

    <title>Flag Flashcards</title>

    <!-- Main stylesheet -->
    <link rel="stylesheet" href="main.css">
</head>

<body>

    <div class="page-wrapper">

        <!-- ================================
             HEADER
        ================================= -->
        <header class="site-header">

            <div class="header-content">

               

                <div class="header-text">
                    <h1>Flag Flashcards</h1>

                  
                </div>

            </div>

        </header>


        <!-- ================================
             MAIN CONTENT
        ================================= -->
        <main class="main-content">

            <section class="game-card">

                <!-- Game heading -->
                <div class="game-heading">

                    

                    <h2>
                        Which country does this flag represent?
                    </h2>

                    <p>
                        Select the correct answer below.
                    </p>

                </div>


                <!-- ============================
                     FLAG DISPLAY
                ============================= -->
                <div class="flag-section">

                    <div class="flag-frame">

                        <img
                            id="flag"
                            src=""
                            alt="Country flag"
                        >

                    </div>

                </div>


                <!-- ============================
                     ANSWER OPTIONS
                ============================= -->
                <form class="answer-form" id="answerForm">

                    <div class="answer-grid">

                        <!-- Answer 1 -->
                        <div class="answer-option">

                            <input
                                type="radio"
                                id="answer1"
                                name="answer"
                                value=""
                            >

                            <label for="answer1">
                                <span class="radio-circle"></span>
                                <span class="answer-text"></span>
                            </label>

                        </div>


                        <!-- Answer 2 -->
                        <div class="answer-option">

                            <input
                                type="radio"
                                id="answer2"
                                name="answer"
                                value=""
                            >

                            <label for="answer2">
                                <span class="radio-circle"></span>
                                <span class="answer-text"></span>
                            </label>

                        </div>


                        <!-- Answer 3 -->
                        <div class="answer-option">

                            <input
                                type="radio"
                                id="answer3"
                                name="answer"
                                value=""
                            >

                            <label for="answer3">
                                <span class="radio-circle"></span>
                                <span class="answer-text"></span>
                            </label>

                        </div>


                        <!-- Answer 4 -->
                        <div class="answer-option">

                            <input
                                type="radio"
                                id="answer4"
                                name="answer"
                                value=""
                            >

                            <label for="answer4">
                                <span class="radio-circle"></span>
                                <span class="answer-text"></span>
                            </label>

                        </div>

                    </div>


                    <!-- Submit button -->
                    <div class="button-area">

                        <button
                            type="button"
                            id="submitAnswer"
                            class="submit-button"
                        >
                            Submit Answer
                        </button>

                    </div>

                </form>


                <!-- ============================
                     SCORE
                ============================= -->
                <div class="score-section">

                    <div class="score-card">

                        <span class="score-label">
                            Correct Answers
                        </span>

                        <strong id="correctAnswers">
                            0
                        </strong>

                    </div>


                    <div class="score-divider"></div>


                    <div class="score-card">

                        <span class="score-label">
                            Total Attempts
                        </span>

                        <strong id="totalAttempts">
                            0
                        </strong>

                    </div>

                </div>

            </section>

        </main>


        <!-- ================================
             FOOTER
        ================================= -->
        <footer class="site-footer">

            <p>
                Arsenal Flag Flashcards
            </p>

            <p>
                Test your knowledge • Learn • Improve
            </p>

        </footer>

    </div>


    <!-- Main JavaScript -->
    <script src="main.js"></script>

</body>

</html>
