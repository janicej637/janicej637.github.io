<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01//EN" "https://www.w3.org/TR/html4/strict.dtd">

<html>

<head>

<meta charset="utf-8"> <title>Flag Flashcards</title>

<meta name="keywords" content="landmarks"> <meta name="description" content="This site contains images of flags from different countries around the world and requires the user to identify the country represented by each flag."> <meta name="author" content="Janice James">

<!-- Link Scripts -->

<script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/1.9.1/jquery.min.js"></script>

<script type="text/javascript" src="imagescroll.js"></script>

<script type="text/javascript" src="main.js"></script>

<!-- Link Stylesheets -->

<link href="main.css" rel="stylesheet" type="text/css"> <link href="https://fonts.googleapis.com/css?family=Unkempt" rel="stylesheet" type="text/css">

<!-- Embedded Script -->

<script type="text/javascript"> window.addEventListener("load", random, false); </script>

</head>

<body>

<!-- Page Wrapper -->

<div class="page">

<!-- Page Header -->
     <div style=" text-align: center; align: center; width: calc(100vw); text-size: 24; padding:0;">

   <h1>
      
        <a href=" https://janicej637.github.io/" style="color: #000080;"><img src="https://clipart-library.com/data_images/469756.png" alt="Home" width="80" height="30"> </a>
    
    </h1>
         
<div class="header">
    <h1><span class="underline">Flag Flashcards</span></h1>
</div>

<!-- Instructions -->
<h2>Submit the country represented by the flag below.</h2>

<!-- Application Contents -->
<div class="contents" id="main">

    <!-- FLAG ROW -->
    <div class="flagRow">
<br>
        <div class="flagDiv">

            <!-- Flag Image -->
            <div class="flag"><br>
                <img id="showFlag" src="" alt="" width="90%" height="250">
            </div>

        </div>

    </div>


    <!-- OPTIONS ROW -->
    <div class="optionsRow">

        <div class="options">

            <!-- Show Result -->
            <marquee behavior="scroll"
                     direction="left"
                     scrollamount="4"
                     id="result">
            </marquee>

            <br>

            <!-- Options -->
            <form>


<!-- Left Column -->
<div class="optionLeft">

    <input type="radio" name="rad" id="a">
    <label for="a" id="opt_a"></label>

    <br><br>

    <input type="radio" name="rad" id="b">
    <label for="b" id="opt_b"></label>

</div>


<!-- Right Column -->
<div class="optionRight">

    <input type="radio" name="rad" id="c">
    <label for="c" id="opt_c"></label>

    <br><br>

    <input type="radio" name="rad" id="d">
    <label for="d" id="opt_d"></label>

</div>

</form>

        </div>


        <!-- Buttons -->
        <div class="buttons">

            <input type="button"
                   id="submit"
                   class="button"
                   value="Submit">

            <input type="button"
                   id="next"
                   class="button"
                   value="Next">

        </div>

    </div>


    <!-- SCORE CARD ROW -->
    <div class="scoreRow">

        <div class="scoreCard">

            <table>

                <!-- Correct Count Row -->
                <tr style="text-align: right;">

                    <td>
                        <h3>Correct Answers</h3>
                    </td>

                    <td>
                        <div class="cBlock">
                            <h5 id="correctCount"></h5>
                        </div>
                    </td>

                </tr>

                <!-- Total Count Row -->
                <tr>

                    <td style="text-align: right;">
                        <h3>Total Attempts</h3>
                    </td>

                    <td>
                        <div class="tBlock">
                            <h5 id="totalCount"></h5>
                        </div>
                    </td>

                </tr>

            </table>

        </div>

    </div>

</div>


<!-- Image Scroller -->
<div id="img" class="imagescroll"></div>

<marquee behavior="scroll"
         direction="right"
         scrollamount="4"
         class="imagescroll">
</marquee>

</div>

</body> </html>
