<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flag Flashcards</title>

    <!-- Keep your existing JavaScript reference -->
    <script src="main.js" defer></script>

    <style>
        /* ================================
           GLOBAL STYLES
        ================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background:
                linear-gradient(135deg, #071a2f 0%, #0b2d4d 50%, #071a2f 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        /* ================================
           MAIN CONTAINER
        ================================= */

        .quiz-container {
            width: 100%;
            max-width: 900px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 35px;
            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
        }

        /* ================================
           HEADER
        ================================= */

        .quiz-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .quiz-header h1 {
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .quiz-header h1 span {
            color: #ef233c;
        }

        .quiz-header p {
            color: #cbd5e1;
            font-size: 1.05rem;
        }

        /* ================================
           FLASHCARD
        ================================= */

        .flashcard {
            background: #ffffff;
            color: #14213d;
            border-radius: 20px;
            padding: 25px;
            margin: 0 auto 30px;
            max-width: 700px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .flashcard:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .flag-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 220px;
            padding: 15px;
            background: #f1f5f9;
            border-radius: 16px;
            margin-bottom: 25px;
        }

        .flag-container img {
            max-width: 100%;
            width: 360px;
            max-height: 220px;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
        }

        /* ================================
           QUESTION
        ================================= */

        .question {
            text-align: center;
            margin-bottom: 22px;
        }

        .question h2 {
            font-size: clamp(1.2rem, 3vw, 1.6rem);
            color: #14213d;
        }

        /* ================================
           RADIO BUTTON ANSWERS
        ================================= */

        .answers {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            max-width: 600px;
            margin: 0 auto;
        }

        .answer-option {
            position: relative;
        }

        .answer-option input[type="radio"] {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .answer-option label {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 58px;
            padding: 12px 18px;
            background: #f8fafc;
            color: #14213d;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                transform 0.2s ease,
                color 0.2s ease;
        }

        .answer-option label:hover {
            border-color: #ef233c;
            transform: translateY(-2px);
            background: #fff5f6;
        }

        .answer-option input[type="radio"]:checked + label {
            background: #ef233c;
            border-color: #ef233c;
            color: #ffffff;
            box-shadow: 0 6px 15px rgba(239, 35, 60, 0.3);
        }

        /* ================================
           BUTTON
        ================================= */

        .submit-area {
            text-align: center;
            margin-top: 25px;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 14px 35px;
            background: #ef233c;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(239, 35, 60, 0.3);
            transition:
                transform 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
        }

        button:hover {
            background: #d90429;
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(239, 35, 60, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        /* ================================
           RESULTS
        ================================= */

        .results {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 25px;
        }

        .result-box {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            padding: 18px;
            text-align: center;
        }

        .result-box span {
            display: block;
            color: #94a3b8;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .result-box strong {
            font-size: 1.7rem;
            color: #ffffff;
        }

        /* ================================
           FEEDBACK
        ================================= */

        #feedback {
            text-align: center;
            min-height: 28px;
            margin-top: 18px;
            font-size: 1rem;
            font-weight: 700;
        }

        /* ================================
           FOOTER
        ================================= */

        footer {
            text-align: center;
            margin-top: 25px;
            color: #94a3b8;
            font-size: 0.85rem;
        }

        /* ================================
           RESPONSIVE DESIGN
        ================================= */

        @media (max-width: 650px) {

            body {
                padding: 15px;
                align-items: flex-start;
            }

            .quiz-container {
                padding: 22px 16px;
                margin-top: 15px;
                border-radius: 18px;
            }

            .flashcard {
                padding: 16px;
            }

            .flag-container {
                min-height: 170px;
            }

            .flag-container img {
                max-height: 170px;
            }

            .answers {
                grid-template-columns: 1fr;
            }

            .results {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 400px) {

            .quiz-header h1 {
                font-size: 1.8rem;
            }

            .quiz-header p {
                font-size: 0.9rem;
            }

            .answer-option label {
                min-height: 52px;
                font-size: 0.95rem;
            }
        }
    </style>
</head>

<body>

    <main class="quiz-container">

        <header class="quiz-header">
            <h1>Flag <span>Flashcards</span></h1>
            <p>Identify the country represented by the flag.</p>
        </header>

        <section class="flashcard">

            <div class="flag-container">
                <!-- Keep the image ID/src used by your main.js -->
                <img id="flagImage"
                     src=""
                     alt="Country flag">
            </div>

            <div class="question">
                <h2>Which country does this flag represent?</h2>
            </div>

            <!-- RADIO BUTTONS KEPT -->
            <div class="answers">

                <div class="answer-option">
                    <input type="radio"
                           id="answer1"
                           name="answer"
                           value="">
                    <label for="answer1"></label>
                </div>

                <div class="answer-option">
                    <input type="radio"
                           id="answer2"
                           name="answer"
                           value="">
                    <label for="answer2"></label>
                </div>

                <div class="answer-option">
                    <input type="radio"
                           id="answer3"
                           name="answer"
                           value="">
                    <label for="answer3"></label>
                </div>

                <div class="answer-option">
                    <input type="radio"
                           id="answer4"
                           name="answer"
                           value="">
                    <label for="answer4"></label>
                </div>

            </div>

            <div class="submit-area">
                <button type="button" id="submitAnswer">
                    Submit Answer
                </button>
            </div>

            <div id="feedback"></div>

        </section>

        <section class="results">

            <div class="result-box">
                <span>Correct Answers</span>
                <strong id="correctAnswers">0</strong>
            </div>

            <div class="result-box">
                <span>Total Attempts</span>
                <strong id="totalAttempts">0</strong>
            </div>

        </section>

        <footer>
            Flag Flashcards &bull; Test your geography knowledge
        </footer>

    </main>

</body>

</html>
