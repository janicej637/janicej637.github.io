<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Flag Flashcards - Test your knowledge of countries and their flags.">

    <title>Flag Flashcards</title>

    <!-- KEEP EXISTING CSS REFERENCE -->
    <link rel="stylesheet" href="main.css">

</head>


<body>

    <div class="page-wrapper">

        <!-- =========================================
             HEADER
        ========================================== -->

        <header class="page-header">

            <div class="header-content">

                <span class="eyebrow">
                    KNOWLEDGE CHALLENGE
                </span>

                <h1>
                    Flag Flashcards
                </h1>

                <p class="subtitle">
                    Test your knowledge of countries and their flags.
                </p>

            </div>

        </header>


        <!-- =========================================
             MAIN CONTENT
        ========================================== -->

        <main class="flashcard-container">


            <!-- =====================================
                 QUESTION CARD
            ====================================== -->

            <section class="question-card"
                     aria-labelledby="question-heading">

                <div class="question-header">

                    <span class="question-number">
                        QUESTION
                    </span>

                    <h2 id="question-heading">
                        Submit the country represented by
                        the flag below.
                    </h2>

                </div>


                <!-- =================================
                     FLAG / IMAGE AREA
                ================================== -->

                <div class="flag-card">

                    <div class="flag-display">

                        <!--
                            KEEP YOUR EXISTING JAVASCRIPT
                            IMAGE FUNCTIONALITY.
                        -->

                    </div>

                </div>


                <!-- =================================
                     ANSWER OPTIONS
                ================================== -->

                <div class="answer-section">

                    <h3>
                        Select your answer
                    </h3>


                    <div class="answer-options">

                        <!-- RADIO OPTION 1 -->

                        <div class="answer-option">

                            <label>

                                <input
                                    type="radio"
                                    name="answer"
                                >

                                <span class="radio-custom"></span>

                                <span class="answer-text">
                                </span>

                            </label>

                        </div>


                        <!-- RADIO OPTION 2 -->

                        <div class="answer-option">

                            <label>

                                <input
                                    type="radio"
                                    name="answer"
                                >

                                <span class="radio-custom"></span>

                                <span class="answer-text">
                                </span>

                            </label>

                        </div>


                        <!-- RADIO OPTION 3 -->

                        <div class="answer-option">

                            <label>

                                <input
                                    type="radio"
                                    name="answer"
                                >

                                <span class="radio-custom"></span>

                                <span class="answer-text">
                                </span>

                            </label>

                        </div>


                        <!-- RADIO OPTION 4 -->

                        <div class="answer-option">

                            <label>

                                <input
                                    type="radio"
                                    name="answer"
                                >

                                <span class="radio-custom"></span>

                                <span class="answer-text">
                                </span>

                            </label>

                        </div>

                    </div>

                </div>


                <!-- =================================
                     SUBMIT AREA
                ================================== -->

                <div class="action-area">

                    <button
                        type="button"
                        class="submit-button">

                        Submit Answer

                    </button>

                </div>

            </section>


            <!-- =====================================
                 SCORE CARDS
            ====================================== -->

            <section class="score-section"
                     aria-label="Game statistics">


                <!-- CORRECT ANSWERS -->

                <div class="score-card">

                    <div class="score-icon">
                        ✓
                    </div>

                    <div class="score-information">

                        <span class="score-label">
                            Correct Answers
                        </span>

                        <strong
                            id="correctAnswers">
                            0
                        </strong>

                    </div>

                </div>


                <!-- TOTAL ATTEMPTS -->

                <div class="score-card">

                    <div class="score-icon">
                        #
                    </div>

                    <div class="score-information">

                        <span class="score-label">
                            Total Attempts
                        </span>

                        <strong
                            id="totalAttempts">
                            0
                        </strong>

                    </div>

                </div>

            </section>


        </main>


        <!-- =========================================
             FOOTER
        ========================================== -->

        <footer class="page-footer">

            <p>
                Test your knowledge. Learn something new.
            </p>

        </footer>


    </div>


    <!-- KEEP EXISTING JAVASCRIPT REFERENCE -->
    <script src="main.js"></script>

</body>

</html>
