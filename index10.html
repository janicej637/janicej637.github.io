
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Arsenal Player Flashcards</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #071d35,
                    #123b67
                );

            color: #172033;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 25px 15px;
        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .quiz-container {
            width: 100%;
            max-width: 850px;

            background: #ffffff;

            border-radius: 24px;

            padding: 35px;

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.35);
        }


        /* =========================
           HEADER
        ========================= */

        .header {
            text-align: center;

            margin-bottom: 25px;

            padding-bottom: 22px;

            border-bottom: 1px solid #e5e7eb;
        }

        .header h1 {
            font-size: clamp(2rem, 5vw, 3rem);

            font-weight: 800;

            color: #d71920;

            letter-spacing: -1px;
        }

        .header h1 span {
            color: #071d35;
        }

        .header p {
            margin-top: 8px;

            color: #667085;

            font-size: 1rem;
        }


        /* =========================
           SCORE
        ========================= */

        .score-bar {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 15px;

            margin-bottom: 25px;
        }

        .score-box {
            text-align: center;

            background: #f5f7fa;

            border: 1px solid #e4e7ec;

            border-radius: 14px;

            padding: 14px;
        }

        .score-label {
            display: block;

            color: #667085;

            font-size: 0.75rem;

            text-transform: uppercase;

            letter-spacing: 1px;
        }

        .score-value {
            display: block;

            margin-top: 3px;

            color: #071d35;

            font-size: 1.5rem;

            font-weight: 800;
        }


        /* =========================
           PLAYER CARD
        ========================= */

        .player-card {
            text-align: center;

            background:
                linear-gradient(
                    180deg,
                    #ffffff,
                    #f7f8fa
                );

            border: 1px solid #e3e6eb;

            border-radius: 20px;

            padding: 25px;

            margin-bottom: 25px;

            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.08);
        }

        .player-card img {
            width: 240px;

            height: 240px;

            object-fit: cover;

            border-radius: 50%;

            border: 6px solid #d71920;

            background: #eeeeee;

            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.18);

            margin-bottom: 15px;
        }

        .player-card h2 {
            font-size: 1.7rem;

            color: #071d35;

            margin-bottom: 5px;
        }

        .position {
            color: #667085;

            font-size: 0.95rem;

            font-weight: 600;
        }


        /* =========================
           QUESTION
        ========================= */

        .question {
            text-align: center;

            margin: 25px 0 15px;

            font-size: 1.15rem;

            font-weight: 700;

            color: #172033;
        }


        /* =========================
           RADIO ANSWERS
        ========================= */

        .answers {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 12px;

            max-width: 650px;

            margin: 0 auto;
        }

        .answer-option {
            position: relative;
        }

        .answer-option input {
            position: absolute;

            opacity: 0;

            pointer-events: none;
        }

        .answer-option label {
            display: flex;

            align-items: center;

            justify-content: center;

            min-height: 58px;

            padding: 12px 15px;

            background: #ffffff;

            border: 2px solid #d0d5dd;

            border-radius: 12px;

            cursor: pointer;

            font-weight: 600;

            color: #344054;

            transition:
                0.2s ease;
        }

        .answer-option label:hover {
            border-color: #d71920;

            background: #fff5f5;
        }

        .answer-option input:checked + label {
            background: #d71920;

            border-color: #d71920;

            color: #ffffff;

            box-shadow:
                0 5px 15px rgba(215, 25, 32, 0.25);
        }


        /* =========================
           BUTTONS
        ========================= */

        .button-row {
            display: flex;

            justify-content: center;

            gap: 12px;

            margin-top: 22px;
        }

        button {
            border: none;

            border-radius: 11px;

            padding: 13px 25px;

            font-size: 0.95rem;

            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .check-button {
            background: #d71920;

            color: #ffffff;

            box-shadow:
                0 5px 15px rgba(215, 25, 32, 0.25);
        }

        .next-button {
            background: #071d35;

            color: #ffffff;

            box-shadow:
                0 5px 15px rgba(7, 29, 53, 0.25);
        }

        .reset-button {
            background: #eef1f5;

            color: #344054;
        }


        /* =========================
           FEEDBACK
        ========================= */

        .feedback {
            min-height: 30px;

            text-align: center;

            margin-top: 18px;

            font-size: 1rem;

            font-weight: 700;
        }

        .correct {
            color: #15803d;
        }

        .incorrect {
            color: #dc2626;
        }


        /* =========================
           FOOTER
        ========================= */

        footer {
            text-align: center;

            color: #667085;

            font-size: 0.8rem;

            margin-top: 25px;

            padding-top: 18px;

            border-top: 1px solid #e5e7eb;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            body {
                padding: 12px;
            }

            .quiz-container {
                padding: 22px 15px;

                border-radius: 18px;
            }

            .player-card {
                padding: 18px;
            }

            .player-card img {
                width: 190px;

                height: 190px;
            }

            .answers {
                grid-template-columns: 1fr;
            }

            .button-row {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }

    </style>
</head>


<body>

<main class="quiz-container">


    <!-- HEADER -->

    <header class="header">

        <h1>
            Arsenal <span>Player Quiz</span>
        </h1>

        <p>
            Test your knowledge of the Arsenal squad
        </p>

    </header>


    <!-- SCORE -->

    <section class="score-bar">

        <div class="score-box">

            <span class="score-label">
                Correct
            </span>

            <span
                class="score-value"
                id="correct-count">
                0
            </span>

        </div>


        <div class="score-box">

            <span class="score-label">
                Attempts
            </span>

            <span
                class="score-value"
                id="attempt-count">
                0
            </span>

        </div>

    </section>


    <!-- PLAYER -->

    <section class="player-card">

        <img
            id="player-image"
            src=""
            alt="Arsenal player">

        <h2 id="player-name">
            Player Name
        </h2>

        <p
            class="position"
            id="player-position">
            Position
        </p>

    </section>


    <!-- QUESTION -->

    <p class="question">
        Who is this Arsenal player?
    </p>


    <!-- FOUR RADIO BUTTON ANSWERS -->

    <section
        class="answers"
        aria-label="Answer choices">


        <div class="answer-option">

            <input
                type="radio"
                id="answer1"
                name="player-answer"
                value="">

            <label for="answer1">
                <span id="answer1-text">
                    Answer 1
                </span>
            </label>

        </div>


        <div class="answer-option">

            <input
                type="radio"
                id="answer2"
                name="player-answer"
                value="">

            <label for="answer2">
                <span id="answer2-text">
                    Answer 2
                </span>
            </label>

        </div>


        <div class="answer-option">

            <input
                type="radio"
                id="answer3"
                name="player-answer"
                value="">

            <label for="answer3">
                <span id="answer3-text">
                    Answer 3
                </span>
            </label>

        </div>


        <div class="answer-option">

            <input
                type="radio"
                id="answer4"
                name="player-answer"
                value="">

            <label for="answer4">
                <span id="answer4-text">
                    Answer 4
                </span>
            </label>

        </div>

    </section>


    <!-- BUTTONS -->

    <div class="button-row">

        <button
            class="check-button"
            type="button"
            onclick="checkAnswer()">
            Check Answer
        </button>

        <button
            class="next-button"
            type="button"
            onclick="nextPlayer()">
            Next Player
        </button>

        <button
            class="reset-button"
            type="button"
            onclick="resetQuiz()">
            Reset
        </button>

    </div>


    <!-- FEEDBACK -->

    <div
        id="feedback"
        class="feedback"
        aria-live="polite">
    </div>


    <!-- FOOTER -->

    <footer>

        Arsenal Player Flashcards

    </footer>


</main>


<script>

/* =====================================
   ARSENAL PLAYERS
===================================== */

const players = [

    {
        name: "Bukayo Saka",
        position: "Forward",
        image: "https://commons.wikimedia.org/wiki/Special:Redirect/file/1_bukayo_saka_arsenal_2025_(cropped).jpg"
    },

    {
        name: "Martin Odegaard",
        position: "Midfielder",
        image: "https://commons.wikimedia.org/wiki/Special:Redirect/file/Martin_Odegaard_France_v_Norway_26_June_26-011.jpg"
    },

    {
        name: "Declan Rice",
        position: "Midfielder",
        image: "https://commons.wikimedia.org/wiki/Special:Redirect/file/Declan_Rice_England_v_Ghana_23_June_2026-143.jpg"
    },

    {
        name: "William Saliba",
        position: "Defender",
        image: "https://commons.wikimedia.org/wiki/Special:Redirect/file/1_william_saliba_arsenal_2025_(cropped).jpg"
    },

    {
        name: "Gabriel Magalhaes",
        position: "Defender",
        image: "https://commons.wikimedia.org/wiki/Special:Redirect/file/1_Gabriel_Magalhães_2026_(cropped).jpg"
    },

    {
        name: "David Raya",
        position: "Goalkeeper",
        image: "https://commons.wikimedia.org/wiki/Special:Redirect/file/David_Raya_Argentina_v_Spain_19_July_2026-003_(cropped).jpg"

    },

    {
        name: "Jurrien Timber",
        position: "Defender",
        image: "https://cdn1.arsenalinsider.com/uploads/19/2024/03/GettyImages-1593911047-1024x683.jpg"
    },

    {
        name: "Piero Hincapie",
        position: "Defender",
        image: "https://commons.wikimedia.org/wiki/Special:Redirect/file/1_Piero_Hincapié_2026.jpg"
    }

];


let currentPlayer = 0;

let correctAnswers = 0;

let totalAttempts = 0;

let answered = false;


/* =====================================
   SHUFFLE
===================================== */

function shuffle(array) {

    return array.sort(
        () => Math.random() - 0.5
    );

}


/* =====================================
   LOAD PLAYER
===================================== */

function loadPlayer() {

    const player =
        players[currentPlayer];


    document.getElementById(
        "player-image"
    ).src = player.image;


    document.getElementById(
        "player-image"
    ).alt =
        player.name;


    document.getElementById(
        "player-name"
    ).textContent =
        player.name;


    document.getElementById(
        "player-position"
    ).textContent =
        player.position;


    createAnswers(player);


    document.getElementById(
        "feedback"
    ).textContent = "";


    document.getElementById(
        "feedback"
    ).className =
        "feedback";


    answered = false;

}


/* =====================================
   CREATE FOUR ANSWERS
===================================== */

function createAnswers(player) {

    let choices = [player.name];


    const otherPlayers =
        players.filter(
            p => p.name !== player.name
        );


    shuffle(otherPlayers);


    choices.push(
        otherPlayers[0].name
    );

    choices.push(
        otherPlayers[1].name
    );

    choices.push(
        otherPlayers[2].name
    );


    shuffle(choices);


    for (
        let i = 0;
        i < 4;
        i++
    ) {

        const radio =
            document.getElementById(
                "answer" + (i + 1)
            );

        const text =
            document.getElementById(
                "answer" + (i + 1) + "-text"
            );


        radio.value =
            choices[i];

        radio.checked = false;

        text.textContent =
            choices[i];

    }

}


/* =====================================
   CHECK ANSWER
===================================== */

function checkAnswer() {

    if (answered) {
        return;
    }


    const selected =
        document.querySelector(
            'input[name="player-answer"]:checked'
        );


    if (!selected) {

        showFeedback(
            "Please select an answer.",
            "incorrect"
        );

        return;
    }


    totalAttempts++;


    if (
        selected.value ===
        players[currentPlayer].name
    ) {

        correctAnswers++;

        showFeedback(
            "Correct! COYG! 🔴⚪",
            "correct"
        );

        answered = true;

    } else {

        showFeedback(
            "Incorrect. Try again!",
            "incorrect"
        );

    }


    updateScore();

}


/* =====================================
   NEXT PLAYER
===================================== */

function nextPlayer() {

    currentPlayer++;

    if (
        currentPlayer >= players.length
    ) {

        currentPlayer = 0;

    }


    loadPlayer();

}


/* =====================================
   FEEDBACK
===================================== */

function showFeedback(
    message,
    type
) {

    const feedback =
        document.getElementById(
            "feedback"
        );


    feedback.textContent =
        message;


    feedback.className =
        "feedback " + type;

}


/* =====================================
   SCORE
===================================== */

function updateScore() {

    document.getElementById(
        "correct-count"
    ).textContent =
        correctAnswers;


    document.getElementById(
        "attempt-count"
    ).textContent =
        totalAttempts;

}


/* =====================================
   RESET
===================================== */

function resetQuiz() {

    currentPlayer = 0;

    correctAnswers = 0;

    totalAttempts = 0;

    updateScore();

    loadPlayer();

}


/* =====================================
   START
===================================== */

loadPlayer();

</script>

</body>
</html>
