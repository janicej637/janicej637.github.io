<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Arsenal Player Flashcards">

    <title>Arsenal Player Flashcards</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            font-family:
                "Segoe UI",
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #071d35 0%,
                    #123b67 50%,
                    #071d35 100%
                );

            color: #172033;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;
        }


        /* ============================
           MAIN CONTENT
        ============================ */

        main {
            width: 100%;

            max-width: 760px;

            background: #ffffff;

            border-radius: 20px;

            padding: 35px;

            text-align: center;

            box-shadow:
                0 20px 50px
                rgba(0, 0, 0, 0.30);
        }


        /* ============================
           HEADER
        ============================ */

        header {
            margin-bottom: 25px;
        }

        header h1 {
            margin: 0;

            color: #d71920;

            font-size:
                clamp(2rem, 6vw, 3rem);

            font-weight: 800;

            letter-spacing: -1px;
        }

        header h1 span {
            color: #071d35;
        }

        header p {
            margin-top: 10px;

            color: #667085;

            font-size: 1rem;
        }


        /* ============================
           ARSENAL FLAG / STRIPE
        ============================ */

        .arsenal-stripe {
            height: 6px;

            width: 100%;

            max-width: 500px;

            margin: 0 auto 25px;

            border-radius: 10px;

            background:
                linear-gradient(
                    to right,
                    #d71920 0%,
                    #d71920 45%,
                    #ffffff 45%,
                    #ffffff 55%,
                    #d71920 55%,
                    #d71920 100%
                );

            border: 1px solid #d71920;
        }


        /* ============================
           PLAYER IMAGE
        ============================ */

        .image-container {
            width: 100%;

            min-height: 320px;

            display: flex;

            justify-content: center;

            align-items: center;

            background:
                linear-gradient(
                    180deg,
                    #f8f9fb,
                    #eef1f5
                );

            border-radius: 18px;

            border: 1px solid #e1e5ea;

            padding: 25px;

            margin-bottom: 25px;
        }

        #player-image {
            width: 260px;

            height: 260px;

            object-fit: cover;

            border-radius: 50%;

            border: 7px solid #d71920;

            background: #ffffff;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.18);
        }


        /* ============================
           QUESTION
        ============================ */

        .question {
            margin: 0 0 20px;

            color: #071d35;

            font-size: 1.25rem;

            font-weight: 700;
        }


        /* ============================
           ANSWERS
        ============================ */

        .answers {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 12px;

            width: 100%;

            max-width: 600px;

            margin: 0 auto;
        }


        .answer {
            position: relative;
        }


        .answer input {
            position: absolute;

            opacity: 0;
        }


        .answer label {
            display: flex;

            justify-content: center;

            align-items: center;

            min-height: 58px;

            padding: 12px 15px;

            border: 2px solid #d0d5dd;

            border-radius: 12px;

            background: #ffffff;

            color: #344054;

            font-weight: 600;

            cursor: pointer;

            transition:
                all 0.2s ease;
        }


        .answer label:hover {
            border-color: #d71920;

            background: #fff6f6;

            transform:
                translateY(-2px);
        }


        .answer input:checked + label {
            background: #d71920;

            border-color: #d71920;

            color: #ffffff;

            box-shadow:
                0 6px 15px
                rgba(215, 25, 32, 0.25);
        }


        /* ============================
           SUBMIT BUTTON
        ============================ */

        .button-area {
            margin-top: 22px;
        }


        button {
            border: none;

            border-radius: 12px;

            padding:
                13px 32px;

            background: #d71920;

            color: #ffffff;

            font-size: 1rem;

            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 6px 15px
                rgba(215, 25, 32, 0.25);

            transition:
                all 0.2s ease;
        }


        button:hover {
            background: #b9141a;

            transform:
                translateY(-2px);
        }


        button:active {
            transform:
                translateY(0);
        }


        /* ============================
           FEEDBACK
        ============================ */

        #feedback {
            min-height: 30px;

            margin-top: 18px;

            font-weight: 700;

            font-size: 1rem;
        }

        .correct {
            color: #15803d;
        }

        .incorrect {
            color: #dc2626;
        }


        /* ============================
           SCORE
        ============================ */

        .score {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 15px;

            margin-top: 25px;
        }


        .score-box {
            background: #f5f7fa;

            border:
                1px solid #e1e5ea;

            border-radius: 14px;

            padding: 15px;
        }


        .score-label {
            display: block;

            color: #667085;

            font-size: 0.75rem;

            text-transform: uppercase;

            letter-spacing: 1px;
        }


        .score-value {
            display: block;

            margin-top: 4px;

            color: #071d35;

            font-size: 1.6rem;

            font-weight: 800;
        }


        /* ============================
           NEXT / RESET
        ============================ */

        .navigation {
            display: flex;

            justify-content: center;

            gap: 10px;

            margin-top: 20px;
        }


        .navigation button {
            background: #071d35;

            box-shadow:
                0 5px 12px
                rgba(7, 29, 53, 0.20);
        }


        .navigation button:hover {
            background: #123b67;
        }


        .navigation .reset {
            background: #eef1f5;

            color: #344054;

            box-shadow: none;
        }


        .navigation .reset:hover {
            background: #e2e6eb;
        }


        /* ============================
           FOOTER
        ============================ */

        footer {
            margin-top: 25px;

            padding-top: 18px;

            border-top:
                1px solid #e5e7eb;

            color: #98a2b3;

            font-size: 0.8rem;
        }


        /* ============================
           MOBILE
        ============================ */

        @media (max-width: 600px) {

            body {
                padding: 10px;
            }

            main {
                padding: 22px 15px;

                border-radius: 16px;
            }

            .image-container {
                min-height: 260px;

                padding: 15px;
            }

            #player-image {
                width: 200px;

                height: 200px;
            }

            .answers {
                grid-template-columns: 1fr;
            }

            .navigation {
                flex-direction: column;
            }

            .navigation button {
                width: 100%;
            }
        }


        @media (prefers-reduced-motion: reduce) {

            * {
                transition: none !important;
            }
        }

    </style>

</head>


<body>

<main>


    <!-- HEADER -->

    <header>

        <h1>
            Arsenal <span>Player Flashcards</span>
        </h1>

        <p>
            Select the player represented by the image below.
        </p>

    </header>


    <!-- ARSENAL DECORATIVE STRIPE -->

    <div class="arsenal-stripe"></div>


    <!-- PLAYER IMAGE -->

    <section class="image-container">

        <img
            id="player-image"
            src=""
            alt="Arsenal player">

    </section>


    <!-- QUESTION -->

    <p class="question">
        Who is this Arsenal player?
    </p>


    <!-- FOUR RADIO BUTTONS -->

    <section
        class="answers"
        aria-label="Player answer choices">


        <div class="answer">

            <input
                type="radio"
                id="answer1"
                name="player-answer"
                value="">

            <label for="answer1">
                <span id="answer1-text">
                    Answer 1
                </span>
            </label>

        </div>


        <div class="answer">

            <input
                type="radio"
                id="answer2"
                name="player-answer"
                value="">

            <label for="answer2">
                <span id="answer2-text">
                    Answer 2
                </span>
            </label>

        </div>


        <div class="answer">

            <input
                type="radio"
                id="answer3"
                name="player-answer"
                value="">

            <label for="answer3">
                <span id="answer3-text">
                    Answer 3
                </span>
            </label>

        </div>


        <div class="answer">

            <input
                type="radio"
                id="answer4"
                name="player-answer"
                value="">

            <label for="answer4">
                <span id="answer4-text">
                    Answer 4
                </span>
            </label>

        </div>

    </section>


    <!-- SUBMIT -->

    <div class="button-area">

        <button
            type="button"
            onclick="checkAnswer()">

            Submit Answer

        </button>

    </div>


    <!-- FEEDBACK -->

    <div
        id="feedback"
        aria-live="polite">
    </div>


    <!-- SCORE -->

    <section class="score">


        <div class="score-box">

            <span class="score-label">
                Correct Answers
            </span>

            <span
                class="score-value"
                id="correct-count">
                0
            </span>

        </div>


        <div class="score-box">

            <span class="score-label">
                Total Attempts
            </span>

            <span
                class="score-value"
                id="attempt-count">
                0
            </span>

        </div>

    </section>


    <!-- NAVIGATION -->

    <div class="navigation">

        <button
            type="button"
            onclick="nextPlayer()">

            Next Player

        </button>


        <button
            type="button"
            class="reset"
            onclick="resetQuiz()">

            Reset

        </button>

    </div>


    <!-- FOOTER -->

    <footer>

        Arsenal Player Flashcards

    </footer>


</main>


<!-- KEEP EXTERNAL JAVASCRIPT -->

<script src="main.js"></script>

</body>

</html>
