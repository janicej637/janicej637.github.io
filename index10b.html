
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
  <p>
<a href=" https://janicej637.github.io/" style="color: #000080;"><img src="https://clipart-library.com/data_images/469756.png" alt="Home" width="80" height=30> </a>

    <title>Flag Flashcards</title>

    <!-- KEEP EXISTING CSS -->
    <link rel="stylesheet" href="main.css">

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* =====================================================
           PAGE
        ===================================================== */

        body {

            min-height: 100vh;

            background: #000000;

            color: #ffff00;

            font-family:
                "Segoe UI",
                Arial,
                Helvetica,
                sans-serif;

            display: flex;

            justify-content: center;

            padding: 30px 15px 50px;

        }


        /* =====================================================
           MAIN WRAPPER
        ===================================================== */

        .page-wrapper {

            width: 100%;

            max-width: 900px;

        }


        /* =====================================================
           HEADER
        ===================================================== */

        .page-header {

            text-align: center;

            padding: 35px 25px 25px;

            margin-bottom: 20px;

        }


        .page-header h1 {

            color: #ffff00;

            font-size:
                clamp(2.2rem, 6vw, 4rem);

            font-weight: 800;

            letter-spacing: 2px;

            text-transform: uppercase;

            text-shadow:
                0 0 10px rgba(255, 255, 0, 0.25);

        }


        .page-header p {

            color: #ffff00;

            margin-top: 10px;

            font-size: 1rem;

            letter-spacing: 0.5px;

            opacity: 0.85;

        }


        /* =====================================================
           MAIN GAME CARD
        ===================================================== */

        .game-card {

            background: #0b0b0b;

            border:
                1px solid #333333;

            border-radius: 24px;

            padding: 30px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.7);

        }


        /* =====================================================
           QUESTION
        ===================================================== */

        .question-area {

            text-align: center;

            margin-bottom: 25px;

        }


        .question-label {

            display: block;

            color: #ffff00;

            font-size: 0.75rem;

            font-weight: 800;

            letter-spacing: 3px;

            text-transform: uppercase;

            margin-bottom: 10px;

            opacity: 0.75;

        }


        .question-area h2 {

            color: #ffff00;

            font-size:
                clamp(1.3rem, 3vw, 1.8rem);

            font-weight: 700;

            line-height: 1.4;

        }


        /* =====================================================
           FLAG DISPLAY
        ===================================================== */

        .flag-area {

            min-height: 300px;

            background: #111111;

            border:
                1px solid #303030;

            border-radius: 20px;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 25px;

            margin-bottom: 30px;

        }


        .flag-area img {

            max-width: 100%;

            max-height: 250px;

            width: auto;

            height: auto;

            object-fit: contain;

            display: block;

        }


        /* =====================================================
           ANSWERS
        ===================================================== */

        .answers-title {

            color: #ffff00;

            text-align: center;

            font-size: 0.85rem;

            font-weight: 800;

            text-transform: uppercase;

            letter-spacing: 2px;

            margin-bottom: 15px;

        }


        .answer-options {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 14px;

        }


        /* =====================================================
           RADIO BUTTONS
        ===================================================== */

        .answer-option {

            position: relative;

        }


        .answer-option input[type="radio"] {

            position: absolute;

            opacity: 0;

        }


        .answer-option label {

            display: flex;

            align-items: center;

            gap: 12px;

            min-height: 62px;

            padding: 12px 18px;

            background: #111111;

            border:
                1px solid #3d3d3d;

            border-radius: 14px;

            color: #ffff00;

            font-weight: 600;

            cursor: pointer;

            transition:
                all 0.2s ease;

        }


        .answer-option label:hover {

            background: #191900;

            border-color: #ffff00;

            transform:
                translateY(-2px);

        }


        /* CUSTOM RADIO */

        .radio-circle {

            width: 21px;

            height: 21px;

            min-width: 21px;

            border:
                2px solid #ffff00;

            border-radius: 50%;

            position: relative;

        }


        .answer-option
        input[type="radio"]:checked
        + label {

            background: #ffff00;

            color: #000000;

            border-color: #ffff00;

            box-shadow:
                0 0 18px
                rgba(255, 255, 0, 0.18);

        }


        .answer-option
        input[type="radio"]:checked
        + label
        .radio-circle {

            border-color: #000000;

            background: #000000;

        }


        .answer-option
        input[type="radio"]:checked
        + label
        .radio-circle::after {

            content: "";

            position: absolute;

            width: 8px;

            height: 8px;

            background: #ffff00;

            border-radius: 50%;

            top: 50%;

            left: 50%;

            transform:
                translate(-50%, -50%);

        }


        /* =====================================================
           SCORE AREA
        ===================================================== */

        .score-area {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 15px;

            margin-top: 25px;

        }


        .score-card {

            background: #0b0b0b;

            border:
                1px solid #333333;

            border-radius: 18px;

            padding: 20px;

            text-align: center;

        }


        .score-card h3 {

            color: #ffff00;

            font-size: 0.75rem;

            text-transform: uppercase;

            letter-spacing: 2px;

            margin-bottom: 8px;

            opacity: 0.75;

        }


        .score-card p {

            color: #ffff00;

            font-size: 2.2rem;

            font-weight: 800;

        }


        /* =====================================================
           FOOTER
        ===================================================== */

        .page-footer {

            text-align: center;

            color: #ffff00;

            font-size: 0.8rem;

            margin-top: 20px;

            opacity: 0.6;

        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 650px) {

            body {

                padding:
                    15px 10px 30px;

            }


            .page-header {

                padding:
                    20px 10px;

            }


            .game-card {

                padding: 18px;

                border-radius: 18px;

            }


            .flag-area {

                min-height: 220px;

                padding: 15px;

            }


            .flag-area img {

                max-height: 180px;

            }


            .answer-options {

                grid-template-columns: 1fr;

            }


            .score-area {

                grid-template-columns: 1fr;

            }

        }


        @media (max-width: 400px) {

            .page-header h1 {

                font-size: 2rem;

            }


            .question-area h2 {

                font-size: 1.15rem;

            }


            .flag-area {

                min-height: 180px;

            }

        }

    </style>

</head>


<body>


    <div class="page-wrapper">


        <!-- =========================================
             HEADER
        ========================================== -->

        <header class="page-header">

            <h1>
                Flag Flashcards
            </h1>

            <p>
                Test your knowledge of countries and their flags.
            </p>

        </header>


        <!-- =========================================
             GAME
        ========================================== -->

        <main class="game-card">


            <!-- QUESTION -->

            <section class="question-area">

                <span class="question-label">
                    Identify the Flag
                </span>

                <h2>
                    Submit the country represented
                    by the flag below.
                </h2>

            </section>


            <!-- FLAG -->

            <section class="flag-area">

                <!--
                    KEEP THE IMAGE ELEMENT USED
                    BY YOUR EXISTING main.js HERE.

                    binder.png has been removed.
                -->

                <img
                    id="flag"
                    src=""
                    alt="Country flag"
                >

            </section>


            <!-- ANSWERS -->

            <section>

                <h3 class="answers-title">
                    Choose an answer
                </h3>


                <div class="answer-options">


                    <!-- ANSWER 1 -->

                    <div class="answer-option">

                        <input
                            type="radio"
                            id="answer1"
                            name="answer"
                            value=""
                        >

                        <label for="answer1">

                            <span class="radio-circle"></span>

                            <span>
                                Answer 1
                            </span>

                        </label>

                    </div>


                    <!-- ANSWER 2 -->

                    <div class="answer-option">

                        <input
                            type="radio"
                            id="answer2"
                            name="answer"
                            value=""
                        >

                        <label for="answer2">

                            <span class="radio-circle"></span>

                            <span>
                                Answer 2
                            </span>

                        </label>

                    </div>


                    <!-- ANSWER 3 -->

                    <div class="answer-option">

                        <input
                            type="radio"
                            id="answer3"
                            name="answer"
                            value=""
                        >

                        <label for="answer3">

                            <span class="radio-circle"></span>

                            <span>
                                Answer 3
                            </span>

                        </label>

                    </div>


                    <!-- ANSWER 4 -->

                    <div class="answer-option">

                        <input
                            type="radio"
                            id="answer4"
                            name="answer"
                            value=""
                        >

                        <label for="answer4">

                            <span class="radio-circle"></span>

                            <span>
                                Answer 4
                            </span>

                        </label>

                    </div>


                </div>

            </section>


            <!-- =====================================
                 SCORE
            ====================================== -->

            <section class="score-area">


                <div class="score-card">

                    <h3>
                        Correct Answers
                    </h3>

                    <p id="correctAnswers">
                        0
                    </p>

                </div>


                <div class="score-card">

                    <h3>
                        Total Attempts
                    </h3>

                    <p id="totalAttempts">
                        0
                    </p>

                </div>


            </section>


        </main>


        <!-- FOOTER -->

        <footer class="page-footer">

            Flag Flashcards

        </footer>


    </div>


    <!-- KEEP EXISTING JAVASCRIPT -->
    <script src="main.js"></script>


</body>

</html>
