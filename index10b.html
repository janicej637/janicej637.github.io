
<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Flag Flashcards</title>

    <!-- KEEP EXISTING CSS -->
    <link rel="stylesheet" href="main.css">


    <style>

        /* ============================================
           RESET
        ============================================ */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* ============================================
           PAGE
        ============================================ */

        body {

            min-height: 100vh;

            background: #000000;

            color: #ffff00;

            font-family:
                "Segoe UI",
                Arial,
                Helvetica,
                sans-serif;

            display: flex;

            justify-content: center;

            align-items: flex-start;

            padding: 25px 15px 50px;

        }


        /* ============================================
           MAIN CONTAINER
        ============================================ */

        #container {

            width: 100%;

            max-width: 900px;

            margin: 0 auto;

        }


        /* ============================================
           HEADER
        ============================================ */

        header {

            text-align: center;

            padding: 20px 10px 25px;

        }


        header .eyebrow {

            display: inline-block;

            border: 1px solid #ffff00;

            border-radius: 50px;

            padding: 7px 18px;

            margin-bottom: 14px;

            color: #ffff00;

            font-size: 0.7rem;

            font-weight: 800;

            letter-spacing: 3px;

            text-transform: uppercase;

        }


        header h1 {

            color: #ffff00;

            font-size:
                clamp(2.2rem, 6vw, 4rem);

            font-weight: 800;

            letter-spacing: 2px;

            line-height: 1.1;

            text-transform: uppercase;

        }


        #instructions {

            margin-top: 12px;

            color: #ffff00;

            font-size: 1rem;

            opacity: 0.75;

        }


        /* ============================================
           GAME CARD
        ============================================ */

        #game {

            background: #0a0a0a;

            border: 1px solid #292929;

            border-radius: 24px;

            padding: 30px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.75);

        }


        /* ============================================
           FLAG AREA
        ============================================ */

        #flagArea {

            width: 100%;

            max-width: 550px;

            height: 330px;

            margin: 0 auto 30px;

            padding: 15px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #111111;

            border: 1px solid #333333;

            border-radius: 20px;

        }


        #showFlag {

            display: block;

            width: 100%;

            max-width: 500px;

            max-height: 290px;

            object-fit: contain;

            border-radius: 10px;

        }


        /* ============================================
           ANSWER TITLE
        ============================================ */

        .answer-title {

            text-align: center;

            margin-bottom: 16px;

            color: #ffff00;

            font-size: 0.75rem;

            font-weight: 800;

            letter-spacing: 3px;

            text-transform: uppercase;

            opacity: 0.75;

        }


        /* ============================================
           ANSWER GRID
        ============================================ */

        #answers {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 14px;

            max-width: 700px;

            margin: 0 auto;

        }


        /* ============================================
           RADIO ANSWER
        ============================================ */

        .answer {

            display: flex;

            align-items: center;

            min-height: 64px;

            padding: 14px 18px;

            background: #111111;

            border: 1px solid #333333;

            border-radius: 14px;

            color: #ffff00;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                border-color 0.2s ease,
                background 0.2s ease;

        }


        .answer:hover {

            background: #191900;

            border-color: #ffff00;

            transform:
                translateY(-2px);

        }


        /* ============================================
           RADIO BUTTON
        ============================================ */

        .answer input[type="radio"] {

            appearance: none;

            -webkit-appearance: none;

            width: 21px;

            height: 21px;

            min-width: 21px;

            margin-right: 13px;

            border: 2px solid #ffff00;

            border-radius: 50%;

            position: relative;

            cursor: pointer;

        }


        .answer input[type="radio"]:checked {

            background: #ffff00;

            border-color: #ffff00;

        }


        .answer input[type="radio"]:checked::after {

            content: "";

            position: absolute;

            width: 7px;

            height: 7px;

            background: #000000;

            border-radius: 50%;

            left: 50%;

            top: 50%;

            transform:
                translate(-50%, -50%);

        }


        /* ============================================
           OPTION TEXT
        ============================================ */

        .answer span {

            color: #ffff00;

            font-size: 1rem;

            font-weight: 600;

        }


        /* ============================================
           RESULT
        ============================================ */

        #result {

            min-height: 52px;

            display: flex;

            align-items: center;

            justify-content: center;

            margin: 25px auto 0;

            padding: 12px 18px;

            border-radius: 12px;

            background-color: transparent;

            color: #ffff00;

            font-size: 1rem;

            font-weight: 800;

            text-align: center;

        }


        /* ============================================
           BUTTON AREA
        ============================================ */

        #buttons {

            display: flex;

            justify-content: center;

            align-items: center;

            flex-wrap: wrap;

            gap: 12px;

            margin-top: 22px;

        }


        button {

            min-width: 175px;

            padding: 14px 25px;

            border: 1px solid #ffff00;

            border-radius: 50px;

            background: #ffff00;

            color: #000000;

            font-family: inherit;

            font-size: 0.9rem;

            font-weight: 800;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;

        }


        button:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 0 20px
                rgba(255, 255, 0, 0.25);

        }


        #next {

            background: transparent;

            color: #ffff00;

        }


        #next:hover {

            background: #ffff00;

            color: #000000;

        }


        /* ============================================
           SCORE
        ============================================ */

        #score {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 15px;

            max-width: 700px;

            margin: 25px auto 0;

        }


        .score-card {

            padding: 20px;

            background: #111111;

            border: 1px solid #292929;

            border-radius: 17px;

            text-align: center;

        }


        .score-card h2 {

            color: #ffff00;

            font-size: 0.7rem;

            font-weight: 800;

            letter-spacing: 2px;

            text-transform: uppercase;

            opacity: 0.7;

        }


        .score-card p {

            margin-top: 8px;

            color: #ffff00;

            font-size: 2.2rem;

            font-weight: 800;

        }


        /* ============================================
           FOOTER
        ============================================ */

        footer {

            padding: 20px;

            text-align: center;

            color: #ffff00;

            font-size: 0.75rem;

            opacity: 0.5;

        }


        /* ============================================
           RESPONSIVE
        ============================================ */

        @media screen and (max-width: 650px) {

            #answers {

                grid-template-columns: 1fr;

            }


            #game {

                padding: 18px;

                border-radius: 18px;

            }


            #flagArea {

                height: 260px;

            }


            #showFlag {

                max-height: 225px;

            }

        }


        @media screen and (max-width: 450px) {

            body {

                padding:
                    10px 8px 30px;

            }


            header h1 {

                font-size: 2rem;

            }


            #instructions {

                font-size: 0.85rem;

            }


            #flagArea {

                height: 210px;

            }


            #showFlag {

                max-height: 180px;

            }


            #score {

                grid-template-columns: 1fr;

            }


            #buttons {

                flex-direction: column;

            }


            button {

                width: 100%;

            }

        }

    </style>

</head>


<body>


<div id="container">


    <!-- ==========================================
         HEADER
    =========================================== -->
<div><p>
<a href=" https://janicej637.github.io/" style="color: #000080;"><img src="https://clipart-library.com/data_images/469756.png" alt="Home" width="80" height=30> </a>
</p> </div>
    <header>
  
 
        <h1>
            Flag Flashcards
        </h1>

        <p id="instructions">
            Identify the country represented by the flag.
        </p>

    </header>


    <!-- ==========================================
         GAME
    =========================================== -->

    <main id="game">


        <!-- ======================================
             FLAG

             REQUIRED BY main.js:
             id="showFlag"
        ======================================= -->

        <div id="flagArea">

            <img
                id="showFlag"
                src=""
                alt="Country flag"
            >

        </div>


        <!-- ======================================
             ANSWERS
        ======================================= -->

        <h2 class="answer-title">
            Select your answer
        </h2>


        <div id="answers">


            <!-- OPTION A -->

            <label
                class="answer"
                id="opt_a"
            >

                <input
                    type="radio"
                    name="rad"
                    id="a"
                    value=""
                >

                <span>
                    Answer A
                </span>

            </label>


            <!-- OPTION B -->

            <label
                class="answer"
                id="opt_b"
            >

                <input
                    type="radio"
                    name="rad"
                    id="b"
                    value=""
                >

                <span>
                    Answer B
                </span>

            </label>


            <!-- OPTION C -->

            <label
                class="answer"
                id="opt_c"
            >

                <input
                    type="radio"
                    name="rad"
                    id="c"
                    value=""
                >

                <span>
                    Answer C
                </span>

            </label>


            <!-- OPTION D -->

            <label
                class="answer"
                id="opt_d"
            >

                <input
                    type="radio"
                    name="rad"
                    id="d"
                    value=""
                >

                <span>
                    Answer D
                </span>

            </label>


        </div>


        <!-- ======================================
             RESULT

             REQUIRED BY main.js:
             id="result"
        ======================================= -->

        <div
            id="result"
            aria-live="polite">
        </div>


        <!-- ======================================
             BUTTONS

             REQUIRED BY main.js:
             id="submit"
             id="next"
        ======================================= -->

        <div id="buttons">

            <button
                type="button"
                id="submit">

                Submit Answer

            </button>


            <button
                type="button"
                id="next">

                Next Flag

            </button>

        </div>


        <!-- ======================================
             SCORE

             REQUIRED BY main.js:
             id="correctCount"
             id="totalCount"
        ======================================= -->

        <div id="score">


            <div class="score-card">

                <h2>
                    Correct Answers
                </h2>

                <p id="correctCount">
                    0
                </p>

            </div>


            <div class="score-card">

                <h2>
                    Total Attempts
                </h2>

                <p id="totalCount">
                    0
                </p>

            </div>


        </div>


    </main>


    <footer>

        <p>
            Test your knowledge. Learn as you play.
        </p>

    </footer>


</div>


<!-- ==============================================
     KEEP YOUR EXISTING JAVASCRIPT
================================================ -->

<script src="main.js"></script>


</body>

</html>
