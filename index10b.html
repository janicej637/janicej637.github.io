
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Flag Flashcards</title>

    <!-- YOUR EXISTING CSS -->
    <link rel="stylesheet" href="main.css">


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            min-height: 100vh;

            background: #000000;

            color: #ffff00;

            font-family:
                "Segoe UI",
                Arial,
                Helvetica,
                sans-serif;

            padding: 25px 15px 45px;

        }


        #container {

            width: 100%;

            max-width: 900px;

            margin: 0 auto;

        }


        /* ===============================
           HEADER
        =============================== */

        header {

            text-align: center;

            padding: 20px 10px 25px;

        }


        .eyebrow {

            display: inline-block;

            padding: 7px 18px;

            margin-bottom: 15px;

            border: 1px solid #ffff00;

            border-radius: 50px;

            color: #ffff00;

            font-size: 0.7rem;

            font-weight: 800;

            letter-spacing: 3px;

            text-transform: uppercase;

        }


        header h1 {

            color: #ffff00;

            font-size:
                clamp(2.2rem, 6vw, 4rem);

            font-weight: 800;

            letter-spacing: 2px;

            line-height: 1.1;

            text-transform: uppercase;

        }


        #instructions {

            margin-top: 12px;

            color: #ffff00;

            font-size: 1rem;

            opacity: 0.75;

        }


        /* ===============================
           GAME PANEL
        =============================== */

        #game {

            background: #090909;

            border: 1px solid #292929;

            border-radius: 24px;

            padding: 30px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.75);

        }


        /* ===============================
           FLAG
        =============================== */

        #flagArea {

            width: 100%;

            max-width: 600px;

            height: 340px;

            margin: 0 auto 30px;

            padding: 18px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #111111;

            border: 1px solid #333333;

            border-radius: 20px;

        }


        /*
           main.js puts the flag URL
           into this image.
        */

        #showFlag {

            display: block;

            max-width: 100%;

            max-height: 300px;

            width: auto;

            height: auto;

            object-fit: contain;

            border-radius: 10px;

        }


        /* ===============================
           ANSWERS
        =============================== */

        .answer-title {

            text-align: center;

            margin-bottom: 16px;

            color: #ffff00;

            font-size: 0.75rem;

            font-weight: 800;

            letter-spacing: 3px;

            text-transform: uppercase;

            opacity: 0.75;

        }


        #answers {

            max-width: 700px;

            margin: 0 auto;

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 14px;

        }


        /* ===============================
           ANSWER LABELS
        =============================== */

        .answer {

            display: flex;

            align-items: center;

            min-height: 65px;

            padding: 14px 18px;

            background: #111111;

            border: 1px solid #333333;

            border-radius: 14px;

            color: #ffff00;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                border-color 0.2s ease;

        }


        .answer:hover {

            background: #191900;

            border-color: #ffff00;

            transform:
                translateY(-2px);

        }

        .answer:hover {

            background: #191900;

            border-color: #ffff00;

            transform:
                translateY(-2px);

        }


        /*
           IMPORTANT:

           main.js changes the background
           color of #opt_a, #opt_b,
           #opt_c and #opt_d.

           Therefore these IDs must remain
           exactly as written.
        */
/* Selected answer */
.answer.selected {
    background: #191900;
    border-color: #ffff00;
    transform: translateY(-2px);
}

        .answer input[type="radio"] {

            display: none;

            -webkit-appearance: none;

            width: 21px;

            height: 21px;

            min-width: 21px;

            margin-right: 13px;

            border: 2px solid #ffff00;

            border-radius: 50%;

            position: relative;

            cursor: pointer;

        }


        .answer input[type="radio"]:checked {

            background: #ffff00;

            border-color: #ffff00;

        }


        .answer input[type="radio"]:checked::after {

            content: "";

            position: absolute;

            width: 7px;

            height: 7px;

            background: #ffff00;

            border-radius: 50%;

            left: 50%;

            top: 50%;

            transform:
                translate(-50%, -50%);

        }


        .answer span {

            color: #ffff00;

            font-size: 1rem;

            font-weight: 600;

        }


        /* ===============================
           RESULT
        =============================== */

        #result {

            min-height: 50px;

            display: flex;

            align-items: center;

            justify-content: center;

            margin: 25px auto 0;

            padding: 12px 18px;

            border-radius: 12px;

            color: #ffff00;

            font-size: 1rem;

            font-weight: 800;

            text-align: center;

        }


        /* ===============================
           BUTTONS
        =============================== */

        #buttons {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 12px;

            flex-wrap: wrap;

            margin-top: 20px;

        }


        button {

            min-width: 175px;

            padding: 14px 25px;

            border: 1px solid #ffff00;

            border-radius: 50px;

            background: #ffff00;

            color: #000000;

            font-family: inherit;

            font-size: 0.9rem;

            font-weight: 800;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;

        }


        button:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 0 20px
                rgba(255, 255, 0, 0.25);

        }


        #next {

            background: transparent;

            color: #ffff00;

        }


        #next:hover {

            background: #ffff00;

            color: #000000;

        }


        /* ===============================
           SCORE
        =============================== */

        #score {

            max-width: 700px;

            margin: 25px auto 0;

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 15px;

        }


        .score-card {

            padding: 20px;

            background: #111111;

            border: 1px solid #292929;

            border-radius: 17px;

            text-align: center;

        }


        .score-card h2 {

            color: #ffff00;

            font-size: 0.7rem;

            font-weight: 800;

            letter-spacing: 2px;

            text-transform: uppercase;

            opacity: 0.7;

        }


        .score-card p {

            margin-top: 8px;

            color: #ffff00;

            font-size: 2.2rem;

            font-weight: 800;

        }


        /* ===============================
           FOOTER
        =============================== */

        footer {

            padding: 20px;

            text-align: center;

            color: #ffff00;

            font-size: 0.75rem;

            opacity: 0.5;

        }


        /* ===============================
           RESPONSIVE
        =============================== */

        @media screen and (max-width: 650px) {

            #answers {

                grid-template-columns: 1fr;

            }


            #game {

                padding: 18px;

                border-radius: 18px;

            }


            #flagArea {

                height: 270px;

            }


            #showFlag {

                max-height: 235px;

            }

        }


        @media screen and (max-width: 450px) {

            body {

                padding:
                    10px 8px 30px;

            }


            header h1 {

                font-size: 2rem;

            }


            #instructions {

                font-size: 0.85rem;

            }


            #flagArea {

                height: 210px;

            }


            #showFlag {

                max-height: 180px;

            }


            #score {

                grid-template-columns: 1fr;

            }


            #buttons {

                flex-direction: column;

            }


            button {

                width: 100%;

            }

        }

    </style>

</head>


<body>


<div id="container">


    <!-- ==========================================
         HEADER
    =========================================== -->

    <header>

        <div >
             <p>
<a href=" https://janicej637.github.io/" style="color: #000080;"><img src="https://clipart-library.com/data_images/469756.png" alt="Home" width="80" height=30> </a>
</p>
        </div>

        <h1>
            Flag Flashcards
        </h1>

        <p id="instructions">
            Identify the country represented by the flag.
        </p>

    </header>


    <!-- ==========================================
         GAME
    =========================================== -->

    <main id="game">


        <!-- ======================================
             FLAG IMAGE

             main.js fills the src attribute.
        ======================================= -->

        <div id="flagArea" >

            <img
                id="showFlag"
                src=""
                alt=""
            >

            
        </div>


        <!-- ======================================
             ANSWERS
        ======================================= -->

        <h2 class="answer-title">
            Select your answer
        </h2>

        <!-- ======================================
             RESULT
        ======================================= -->

        <div
            id="result"
            aria-live="polite">
        </div>

        <div id="answers">

            
    <!-- Options -->
      
          
<label class="answer"   id="opt_a">
     <input type="radio" id="a" name="rad" > 
      <span id="option1"></span>
</label>

         
                <label  class="answer"  id="opt_b">
     <input type="radio" id="b" name="rad" > 
                      <span id="option2"></span>
</label>
                

<label class="answer"  id="opt_c">
  <input type="radio" id="c" name="rad" > 
      <span id="option3"></span>
</label>
                

<label class="answer"   id="opt_d">
 <input type="radio" id="d" name="rad" >  
      <span id="option4"></span>
</label>

             

  
   

        




        <!-- ======================================
             BUTTONS
        ======================================= -->

        <div id="buttons">

            <button
                type="button"
                id="submit" >

                Submit Answer

            </button>


            <button
                type="button"
                id="next" >

                Next Flag

            </button>

        </div>


        <!-- ======================================
             SCORE
        ======================================= -->

        <section id="score">


            <div class="score-card">

                <h2>
                    Correct Answers
                </h2>

                <p id="correctCount">
                    0
                </p>

            </div>


            <div class="score-card">

                <h2>
                    Total Attempts
                </h2>

                <p id="totalCount">
                    0
                </p>

            </div>


        </section>


    </main>


    <footer>

        <p>
            Test your knowledge. Learn as you play.
        </p>

    </footer>


</div>


<!-- ==============================================
     REFERENCE YOUR GITHUB main.js
================================================ -->

<script src="https://janicej637.github.io/main.js"></script>


</body>

</html>
