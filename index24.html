<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive 3D Bar Graph</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
        }

        h1 {
            margin: 0 0 5px 0;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        p {
            margin: 0;
            font-size: 14px;
            color: #aaaaaa;
        }

        #tooltip {
            position: absolute;
            padding: 10px 15px;
            background: rgba(20, 20, 20, 0.85);
            border: 1px solid #444;
            border-radius: 6px;
            color: white;
            font-size: 13px;
            pointer-events: none;
            display: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            z-index: 10;
        }

        .instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            color: #ccc;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <h1>Quarterly Revenue Matrix</h1>
        <p>3D Visualization across Categories and Time</p>
    </div>

    <div id="tooltip"></div>
    <div class="instructions">← Drag to rotate | Scroll to zoom | Hover bars to inspect →</div>
    <div id="canvas-container"></div>

    <!-- Load Three.js and OrbitControls via CDN -->
    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>

    <script>

        // 2. SCENE SETUP
        const container = document.getElementById('canvas-container');
        const tooltip = document.getElementById('tooltip');
        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x141414);
        scene.fog = new THREE.FogExp2(0x141414, 0.015);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(15, 15, 20);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.05; // Don't go below ground
        controls.minDistance = 5;
        controls.maxDistance = 50;

        // 3. LIGHTING
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 40, 20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 100;
        const d = 15;
        dirLight.shadow.camera.left = -d;
        dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d;
        dirLight.shadow.camera.bottom = -d;
        scene.add(dirLight);

        // 4. GRID AND FLOOR STAGE
        const gridX = xLabels.length;
        const gridZ = zLabels.length;
        const spacing = 2.5;
        
        // Calculate offsets to center the bar group at (0,0,0)
        const offsetX = ((gridX - 1) * spacing) / 2;
        const offsetZ = ((gridZ - 1) * spacing) / 2;

        const floorGeo = new THREE.PlaneGeometry(50, 50);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x1e1e1e, roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = 0;
        floor.receiveShadow = true;
        scene.add(floor);

        const gridHelper = new THREE.GridHelper(30, 30, 0x444444, 0x222222);
        gridHelper.position.y = 0.01; 
        scene.add(gridHelper);

                    if (hoveredBar) {
                        hoveredBar.material.emissive.setHex(0x000000);
                    }
                    
                    // Apply emission tint to active hover focus item
                    hoveredBar = topIntersect;
                    hoveredBar.material.emissive.setHex(0x333333);

                    // Update UI text values 
                    tooltip.innerHTML = `
                        <strong>Category:</strong> ${hoveredBar.userData.zLabel}<br/>
                        <strong>Timeline:</strong> ${hoveredBar.userData.xLabel}<br/>
                        <strong>Revenue:</strong> ${hoveredBar.userData.value}
                    `;
                    tooltip.style.display = 'block';
                }

                // Move visual floating UI context module alongside cursor coordinates
                tooltip.style.left = (event.clientX + 15) + 'px';
                tooltip.style.top = (event.clientY + 15) + 'px';

            } else {
                // Clear active target details on standard background canvas focus area departure
                if (hoveredBar) {
                    hoveredBar.material.emissive.setHex(0x000000);
                    hoveredBar = null;
                }
                tooltip.style.display = 'none';
            }
        }

        window.addEventListener('mousemove', onMouseMove, false);

        // 7. RESPONSIVE RENDER HANDLING
        window.addEventListener('resize', onWindowResize, false);

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // 8. ANIMATION LOOP
        function animate() {
            requestAnimationFrame(animate);
            controls.update(); // Smooth damping updates
            renderer.render(scene, camera);
        }
        
        animate();
    </script>
</body>
</html>
