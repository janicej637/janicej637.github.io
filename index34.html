<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Join Junction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=JetBrains+Mono:wght@400;600&family=Unbounded:wght@600;800&display=swap">
<style>
/* Layout: one play board. Left table is tangerine, right table is cyan, matches are violet.
   Rows, result cells and Venn regions all reuse those three colors so the picture explains the join. */
:root{
  --bg:#EDF0F6; --surface:#FFFFFF; --surface-2:#F4F6FB; --fg:#161A2B; --muted:#5B6480; --line:#D3D9E8;
  --left:#EA580C; --right:#0891B2; --match:#7C3AED; --on-match:#FFFFFF; --good:#15803D; --bad:#DC2626;
  --code-bg:#161A2B; --code-fg:#E6EAF7; --code-kw:#9DB2FF; --code-join:#FFB067;
  --font-display:'Unbounded',system-ui,sans-serif;
  --font-body:'Figtree',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --left-t:color-mix(in srgb,var(--left) 15%,var(--surface));
  --right-t:color-mix(in srgb,var(--right) 15%,var(--surface));
  --left-b:color-mix(in srgb,var(--left) 45%,var(--surface));
  --right-b:color-mix(in srgb,var(--right) 45%,var(--surface));
  --off:color-mix(in srgb,var(--muted) 14%,var(--surface));
  --off-2:color-mix(in srgb,var(--muted) 26%,var(--surface));
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1220; --surface:#171B2E; --surface-2:#1E2338; --fg:#EEF1FA; --muted:#9AA3BF; --line:#2B3250;
    --left:#FF8A4C; --right:#35C4E0; --match:#A78BFA; --on-match:#14102A; --good:#4ADE80; --bad:#F87171;
    --code-bg:#0A0D18; --code-fg:#E6EAF7; --code-kw:#9DB2FF; --code-join:#FFB067;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1220; --surface:#171B2E; --surface-2:#1E2338; --fg:#EEF1FA; --muted:#9AA3BF; --line:#2B3250;
  --left:#FF8A4C; --right:#35C4E0; --match:#A78BFA; --on-match:#14102A; --good:#4ADE80; --bad:#F87171;
  --code-bg:#0A0D18; --code-fg:#E6EAF7; --code-kw:#9DB2FF; --code-join:#FFB067;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 16px/1.5 var(--font-body);padding-inline:16px;padding-block:20px 56px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--match);outline-offset:2px}
code{font-family:var(--font-mono);font-size:.88em;background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.app{max-width:960px;margin:0 auto}

/* header */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;margin-bottom:30px}
.brand{display:flex;align-items:center;gap:10px;font:800 1rem var(--font-display);letter-spacing:-.01em;order:1}
.brand svg{width:44px;height:30px;flex:none}
.tools{margin-left:auto;order:2}
.pips{display:flex;gap:6px;order:3;flex-basis:100%}
.pip{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);font:600 .8rem var(--font-mono);cursor:pointer;display:grid;place-items:center}
.pip[aria-current="step"]{border-color:var(--fg);color:var(--fg);box-shadow:0 0 0 3px color-mix(in srgb,var(--match) 35%,transparent)}
.pip.done{background:var(--match);border-color:var(--match);color:var(--on-match)}
.pip:disabled{opacity:.4;cursor:not-allowed}
.snd{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-weight:600;font-size:.88rem;cursor:pointer}
.snd svg{width:18px;height:18px}
.snd[aria-pressed="false"]{color:var(--muted)}
@media (min-width:760px){
  .pips{order:2;flex-basis:auto;margin-inline:auto}
  .tools{order:3;margin-left:0}
}

/* level head */
.top{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:24px 32px;align-items:start}
@media (max-width:820px){.top{grid-template-columns:minmax(0,1fr)}}
.eyebrow{font:600 .72rem var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0}
h1{font:800 clamp(1.5rem,5vw,2.2rem)/1.12 var(--font-display);letter-spacing:-.02em;text-wrap:balance;margin:8px 0 12px}
h2{text-wrap:balance}
.lede{max-width:62ch;margin:0}
.sqlwrap{min-width:0}
.sql{margin:8px 0 0;background:var(--code-bg);color:var(--code-fg);border-radius:14px;padding:16px 18px;font:400 .84rem/1.75 var(--font-mono);overflow-x:auto;white-space:pre}
.sql .kw{color:var(--code-kw)}
.sql .jn{color:var(--code-join);font-weight:600}
.sql .blank{border-bottom:2px dashed var(--code-join);padding-inline:4px}

/* tables board */
.board{margin-top:28px}
.tables{position:relative;display:grid;grid-template-columns:minmax(0,1fr) clamp(40px,10vw,96px) minmax(0,1fr);align-items:start}
.links{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.tbl{display:grid;gap:6px;min-width:0}
.tbl-name{display:flex;align-items:center;gap:8px;font:600 .8rem var(--font-mono);margin-bottom:2px}
.tbl.R .tbl-name{justify-content:flex-start}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}
.tbl.L .sw,.sw.l{background:var(--left)}
.tbl.R .sw,.sw.r{background:var(--right)}
.sw.n{background:repeating-linear-gradient(135deg,var(--off-2) 0 3px,var(--off) 3px 6px);border:1px solid var(--line)}
.row{--kc:68px;display:grid;align-items:center;gap:6px;width:100%;min-height:40px;padding:0 8px 0 10px;border-radius:8px;border:1.5px solid var(--line);text-align:left;font:600 .85rem/1.2 var(--font-mono);transition:opacity .2s,outline-color .2s}
@media (min-width:520px){.row{--kc:96px}}
.tbl.L .row{grid-template-columns:minmax(0,1fr) var(--kc);background:var(--left-t);border-color:var(--left-b)}
.tbl.R .row{grid-template-columns:var(--kc) minmax(0,1fr);background:var(--right-t);border-color:var(--right-b)}
.row .v{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .k{display:inline-grid;place-items:center;min-width:26px;height:24px;padding:0 6px;border-radius:6px;background:var(--surface);border:1px solid var(--line)}
.tbl.L .row .k{justify-self:end}
.tbl.R .row .k{justify-self:start}
.row.head{min-height:22px;padding:0 8px 0 10px;background:none;border-color:transparent;font-weight:400;font-size:.66rem;color:var(--muted)}
.tbl.L .row.head{background:none;border-color:transparent}
.tbl.R .row.head{background:none;border-color:transparent}
.row.head .k{background:none;border:none;padding:0;min-width:0;height:auto;display:inline-flex;gap:4px;align-items:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.head .kico{display:none}
@media (min-width:520px){.row.head .kico{display:inline-block}}
.row.pick{cursor:pointer}
.row.pick:hover{filter:brightness(1.04);outline:2px solid color-mix(in srgb,var(--fg) 30%,transparent)}
.row.sel{outline:3px solid var(--fg)}
.row.done{outline:2.5px solid var(--match)}
.row.shake{animation:shake .4s}
.row.hl{outline:3px solid var(--match);outline-offset:1px}
.tables.has-hl .row:not(.hl):not(.head){opacity:.35}
.tables.has-hl .lkg:not(.hl),.tables.has-hl .stubg:not(.hl){opacity:.18}

.lk{fill:none;stroke:var(--match);stroke-width:3;stroke-linecap:round}
.dot{fill:var(--match)}
.lkg.hl .lk{stroke-width:5.5}
.lk.new{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .7s ease forwards}
.stub{fill:none;stroke:var(--muted);stroke-width:2;stroke-dasharray:4 4}
.xx{fill:none;stroke:var(--bad);stroke-width:2.5;stroke-linecap:round}
.stubg{animation:fade .5s ease both}

.legend{display:flex;flex-wrap:wrap;gap:8px 20px;list-style:none;padding:0;margin:22px 0 0;font-size:.85rem;color:var(--muted)}
.legend li{display:flex;align-items:center;gap:8px}

/* result cells */
.cand{display:grid;grid-template-columns:1fr 1fr;min-width:0;padding:0;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);text-align:left;cursor:pointer;transition:transform .15s,box-shadow .15s}
.cand.static{cursor:default}
button.cand:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 16px -10px color-mix(in srgb,var(--fg) 60%,transparent)}
button.cand:disabled{cursor:default}
.cell{padding:10px 12px;font:600 .85rem/1.2 var(--font-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cell.L{background:var(--left-t)}
.cell.R{background:var(--right-t)}
.cell.null{background:repeating-linear-gradient(135deg,var(--off-2) 0 5px,var(--off) 5px 10px);color:var(--muted);font-style:italic;font-weight:400}
.cand.bad{border-color:var(--bad);animation:shake .4s}
.cand.ok{border-color:var(--good);animation:glow .9s ease-out}

.zones{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;margin-top:28px}
@media (max-width:680px){.zones{grid-template-columns:minmax(0,1fr)}}
.zone h2{display:flex;justify-content:space-between;gap:10px;margin:0 0 10px;font:600 .74rem var(--font-mono);letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.drop{border-radius:14px;padding:12px;min-height:170px;align-content:start}
.tray .drop{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;border:2px dashed var(--line);background:var(--surface-2)}
.result .drop{display:grid;gap:8px;border:2px solid var(--line);background:var(--surface)}
.res-head{display:grid;grid-template-columns:1fr 1fr;padding:0 12px;font:600 .72rem var(--font-mono);color:var(--muted)}
.empty{grid-column:1/-1;margin:0;padding:22px 8px;text-align:center;color:var(--muted);font-size:.92rem}
.solo{margin-top:24px}

/* actions */
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:22px}
.btn{border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:11px 18px;font-weight:700;font-size:.95rem;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--fg)}
.btn.primary{background:var(--match);border-color:var(--match);color:var(--on-match)}
.btn:disabled{opacity:.45;cursor:default}
.status{flex:1 1 220px;margin:0;min-height:1.5em;font-weight:600}
.status.bad{color:var(--bad)}
.status.good{color:var(--good)}
.hint{margin:14px 0 0;padding:12px 16px;border-radius:12px;background:var(--surface-2);border:1px dashed var(--line);max-width:70ch}

/* outcome */
.outcome{margin-top:24px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 28px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:20px 22px;animation:rise .5s ease both}
.outcome.solo{grid-template-columns:minmax(0,1fr);margin-top:24px}
@media (max-width:560px){.outcome{grid-template-columns:minmax(0,1fr)}}
.ot h2{font:800 1.25rem/1.2 var(--font-display);margin:6px 0 8px;letter-spacing:-.01em}
.ot p{margin:0 0 14px;max-width:60ch}
.ot .btn{margin-top:2px}
.orow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.stars{display:inline-flex;gap:2px}
.stars svg{width:20px;height:20px}
.st-on{fill:var(--match)}
.st-off{fill:var(--off-2)}
.venn{width:210px;max-width:100%;height:auto;display:block}
.venn .on-l{fill:var(--left)}
.venn .on-r{fill:var(--right)}
.venn .on-b{fill:var(--match)}
.venn .off{fill:var(--off)}
.venn .off-b{fill:var(--off-2)}
.venn .ring{fill:none;stroke:var(--fg);stroke-width:1.5;opacity:.55}
.venn .vt{font:600 11px var(--font-mono);fill:var(--muted)}

/* detective */
.q{font:800 1.1rem var(--font-display);margin:28px 0 12px;letter-spacing:-.01em}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.choice{display:grid;justify-items:center;gap:8px;padding:14px 10px 12px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;font:700 .86rem var(--font-mono)}
.choice:hover:not(:disabled){border-color:var(--fg)}
.choice .venn{width:92px}
.choice.wrong{border-color:var(--bad);opacity:.55}
.choice.right{border-color:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 30%,transparent)}
.choice:disabled{cursor:default}

/* finale */
.score{display:flex;align-items:center;gap:12px;margin:18px 0 8px;font:700 1rem var(--font-mono)}
.cheats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:22px}
.cheat{display:grid;gap:6px;justify-items:start;padding:16px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface)}
.cheat .venn{width:120px}
.cheat h3{margin:4px 0 0;font:800 .9rem var(--font-display);letter-spacing:-.01em}
.cheat p{margin:0;font-size:.9rem;color:var(--muted)}

@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
@keyframes glow{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 55%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .lk.new{animation:none;stroke-dasharray:none;stroke-dashoffset:0}
}
</style>

<div class="app">
  <header class="bar">
    <div class="brand">
      <svg viewBox="0 0 44 30" aria-hidden="true"><defs><clipPath id="bc"><circle cx="15" cy="15" r="12"/></clipPath></defs><circle cx="15" cy="15" r="12" fill="var(--left)"/><circle cx="29" cy="15" r="12" fill="var(--right)"/><circle cx="29" cy="15" r="12" clip-path="url(#bc)" fill="var(--match)"/></svg>
      <span>Join Junction</span>
    </div>
    <nav class="pips" id="pips" aria-label="Levels"></nav>
    <div class="tools">
      <button type="button" class="snd" id="sound" data-act="sound" aria-pressed="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4z"/><path id="sndwave" d="M15.5 8.5a5 5 0 010 7M18.5 5.5a9 9 0 010 13"/></svg>
        <span id="sndlabel">Sound on</span>
      </button>
    </div>
  </header>
  <main id="stage"></main>
</div>

<script>
(function(){
'use strict';
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const reduce=()=>!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);

/*DATA*/
function mk(lt,lk,lv,rt,rk,rv,left,right){
  return {lt:lt,lk:lk,lv:lv,rt:rt,rk:rk,rv:rv,
    left:left.map((a,i)=>({id:'l'+i,key:a[0],val:a[1]})),
    right:right.map((a,i)=>({id:'r'+i,key:a[0],val:a[1]}))};
}
const SHOP=mk('customers','id','name','orders','customer_id','item',
  [[1,'Ana'],[2,'Ben'],[3,'Cleo'],[4,'Dev']],
  [[1,'Book'],[1,'Lamp'],[3,'Mug'],[9,'Pen']]);

const ROUNDS=[
  {answer:'left',ds:mk('teachers','id','name','classes','teacher_id','class',
    [[1,'Park'],[2,'Diaz'],[3,'Kim']],[[1,'Art'],[3,'Music'],[3,'Dance'],[9,'Chess']])},
  {answer:'full',ds:mk('plants','id','name','waterings','plant_id','day',
    [[1,'Fern'],[2,'Cactus'],[3,'Basil']],[[1,'Mon'],[3,'Tue'],[3,'Thu'],[5,'Wed']])},
  {answer:'inner',ds:mk('players','id','name','scores','player_id','pts',
    [[1,'Ravi'],[2,'Lena'],[3,'Omar']],[[1,'40'],[1,'55'],[3,'70'],[8,'12']])},
  {answer:'right',ds:mk('movies','id','title','reviews','movie_id','note',
    [[1,'Orbit'],[2,'Hush'],[4,'Tango']],[[1,'Fun'],[1,'Slow'],[2,'Gripping'],[7,'Boring']])}
];

const JOIN={
  inner:{name:'INNER JOIN',kinds:['both'],on:{L:0,B:1,R:0}},
  left:{name:'LEFT JOIN',kinds:['both','left'],on:{L:1,B:1,R:0}},
  right:{name:'RIGHT JOIN',kinds:['both','right'],on:{L:0,B:1,R:1}},
  full:{name:'FULL OUTER JOIN',kinds:['both','left','right'],on:{L:1,B:1,R:1}},
  anti:{name:'LEFT JOIN + IS NULL',kinds:['left'],on:{L:1,B:0,R:0}}
};

function candidates(ds){
  const rows=[];
  ds.left.forEach(l=>{
    const ms=ds.right.filter(r=>r.key===l.key);
    if(ms.length){ms.forEach(r=>rows.push({id:'m-'+l.id+'-'+r.id,kind:'both',l:l,r:r}));}
    else{rows.push({id:'l-'+l.id,kind:'left',l:l,r:null});}
  });
  ds.right.forEach(r=>{
    if(!ds.left.some(l=>l.key===r.key)){rows.push({id:'r-'+r.id,kind:'right',l:null,r:r});}
  });
  return rows;
}
function allPairs(ds){
  const out=[];
  ds.left.forEach(l=>ds.right.forEach(r=>{if(l.key===r.key)out.push([l.id,r.id]);}));
  return out;
}
function sqlFor(ds,type,kw){
  const word=kw||(type==='anti'?'LEFT JOIN':JOIN[type].name);
  let s='SELECT '+ds.lt+'.'+ds.lv+', '+ds.rt+'.'+ds.rv+'\nFROM '+ds.lt+'\n'+word+' '+ds.rt+'\n  ON '+ds.lt+'.'+ds.lk+' = '+ds.rt+'.'+ds.rk;
  s+=type==='anti'?'\nWHERE '+ds.rt+'.'+ds.rk+' IS NULL;':';';
  return s;
}
function rng(seed){
  return function(){
    seed|=0;seed=seed+0x6D2B79F5|0;
    let t=Math.imul(seed^seed>>>15,1|seed);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;
  };
}
function shuffle(a,seed){
  const r=rng(seed),b=a.slice();
  for(let i=b.length-1;i>0;i--){const j=Math.floor(r()*(i+1));const x=b[i];b[i]=b[j];b[j]=x;}
  return b;
}
/*ENDDATA*/

/* ---------- levels ---------- */
const LEVELS=[
  {kind:'connect',short:'Keys',title:'Find the matching keys',
   lede:'Each order stores the <code>id</code> of the customer who placed it. That shared value is the key. Tap a customer, then tap an order with the same key to connect them.',
   hint:'Ana has id 1. Find the orders whose customer_id is also 1, then try Cleo, who has id 3.',
   done:'Ana has two orders and Cleo has one. Ben, Dev and the Pen order have no partner, which the red crosses mark. Every join type is a rule for what to do with those unmatched rows.'},
  {kind:'build',type:'inner',short:'Inner',title:'Inner join keeps the pairs',
   lede:'An <code>INNER JOIN</code> returns a row only when both tables have a match. Tap the rows it would return to move them into the result, then run the query.',
   hint:'Keep only rows where both cells hold a value. Anything with NULL stays in the tray.',
   done:'Three pairs matched, so three rows came back. Ana appears twice because she placed two orders. Ben, Dev and the Pen order had no partner and were left out.'},
  {kind:'build',type:'left',short:'Left',title:'Left join keeps every customer',
   lede:'A <code>LEFT JOIN</code> keeps every row from the left table, the one named after <code>FROM</code>. When a row has no match, the right side is filled with NULL.',
   hint:'Every customer must appear at least once. The Pen order has no customer, so it stays out.',
   done:'Ben and Dev have no orders, so their item is NULL. The Pen order stays out because it only exists in the right table.'},
  {kind:'build',type:'right',short:'Right',title:'Right join keeps every order',
   lede:'A <code>RIGHT JOIN</code> is the mirror image. Every row from the right table stays, and a missing left side becomes NULL.',
   hint:'Every order must appear. Customers who never ordered stay out.',
   done:'The Pen order belongs to customer 9, who is not in the customers table, so its name is NULL. Ben and Dev have no orders and drop out.'},
  {kind:'build',type:'full',short:'Full',title:'Full outer join keeps everything',
   lede:'A <code>FULL OUTER JOIN</code> keeps the rows of both tables. Matches are paired up, and every row without a partner gets NULL on the missing side.',
   hint:'Nothing gets dropped here. Every candidate row belongs in the result.',

let AC=null;
function audio(){
  if(AC===null){
    try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=false;}
  }
  if(AC&&AC.state==='suspended'){AC.resume().catch(()=>{});}
  return AC||null;
}
function tone(a,f,at,dur,type,vol,f2){
  const t0=a.currentTime+at,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';
  o.frequency.setValueAtTime(f,t0);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol||0.1,t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g);g.connect(a.destination);
  o.start(t0);o.stop(t0+dur+0.05);
}
const SFX={
  tap:a=>tone(a,440,0,.07,'triangle',.07),
  add:a=>{tone(a,523,0,.09,'triangle',.1);tone(a,784,.07,.12,'triangle',.1);},
  drop:a=>{tone(a,659,0,.09,'triangle',.08);tone(a,440,.07,.12,'triangle',.08);},
  link:a=>{tone(a,587,0,.1,'sine',.12);tone(a,880,.09,.18,'sine',.12);tone(a,1175,.18,.26,'sine',.08);},
  bad:a=>{tone(a,170,0,.22,'sawtooth',.07,110);tone(a,160,.12,.22,'sawtooth',.05,100);},
  win:a=>{[523,659,784,1047].forEach((f,i)=>tone(a,f,i*.11,.26,'triangle',.12));tone(a,1319,.5,.5,'sine',.1);}
};

/* ---------- lines between tables ---------- */
function drawLinks(){
  const wrap=$('#tables'),svg=$('#links');
  if(!wrap||!svg)return;
  const ds=curDS(),t=S.t,L=LEVELS[S.level];
  if(!ds||!L)return;
  const W=wrap.getBoundingClientRect();
  svg.setAttribute('viewBox','0 0 '+W.width+' '+W.height);
  svg.style.width=W.width+'px';svg.style.height=W.height+'px';
  const P=id=>{
    const el=wrap.querySelector('.row[data-id="'+id+'"]');
    if(!el)return null;
    const r=el.getBoundingClientRect();
    return {x0:r.left-W.left,x1:r.right-W.left,y:r.top-W.top+r.height/2};
  };
  const connect=L.kind==='connect';
  const pairs=connect?t.found:allPairs(ds);
  let out='';
  pairs.forEach(p=>{
    const A=P(p[0]),B=P(p[1]);
    if(!A||!B)return;
    const mx=(A.x1+B.x0)/2,key=p[0]+'-'+p[1];
    const isNew=connect?t.lastFound===key:t.anim;
    out+='<g class="lkg" data-p="'+key+'"><path class="lk'+(isNew?' new':'')+'" pathLength="1" d="M'+A.x1+' '+A.y+' C'+mx+' '+A.y+' '+mx+' '+B.y+' '+B.x0+' '+B.y+'"/><circle class="dot" cx="'+A.x1+'" cy="'+A.y+'" r="4"/><circle class="dot" cx="'+B.x0+'" cy="'+B.y+'" r="4"/></g>';
  });
  const f0=ds.left[0]&&P(ds.left[0].id),f1=ds.right[0]&&P(ds.right[0].id);
  const gap=f0&&f1?f1.x0-f0.x1:40,len=Math.max(10,gap*.38);
  const stub=(id,x,y,dir)=>{
    const cx=x+dir*len;
    return '<g class="stubg" data-s="'+id+'"><path class="stub" d="M'+x+' '+y+' H'+cx+'"/><path class="xx" d="M'+(cx-4)+' '+(y-4)+' l8 8 M'+(cx-4)+' '+(y+4)+' l8 -8"/></g>';
  };
  if(!connect||t.done){
    ds.left.forEach(l=>{
      if(ds.right.some(r=>r.key===l.key))return;
      const A=P(l.id);if(A)out+=stub(l.id,A.x1,A.y,1);
    });
    ds.right.forEach(r=>{
      if(ds.left.some(l=>l.key===r.key))return;
      const B=P(r.id);if(B)out+=stub(r.id,B.x0,B.y,-1);
    });
  }
  svg.innerHTML=out;
  t.anim=false;
}

function renderConnect(root){

function updateConnect(){
  const t=S.t,total=allPairs(SHOP).length;
  $$('#tables .row.pick').forEach(el=>{
    const id=el.dataset.id;
    el.classList.toggle('sel',id===t.sel.l||id===t.sel.r);
    el.classList.toggle('done',t.found.some(p=>p[0]===id||p[1]===id));
  });
  const st=$('#status');
  st.className='status '+t.mt;
  st.textContent=t.msg||(t.found.length+' of '+total+' connections found');
  $('#hintBox').innerHTML=t.hint?'<p class="hint">Hint: '+esc(LEVELS[S.level].hint)+'</p>':'';
  drawLinks();
  if(t.found.length===total&&!t.done)finishConnect();
}
function pick(el){
  const t=S.t;
  if(t.done)return;
  const side=el.dataset.side,id=el.dataset.id;
  t.msg='';t.mt='';
  if(t.sel[side]===id){t.sel[side]=null;play('tap');updateConnect();return;}
  t.sel[side]=id;play('tap');
  if(t.sel.l&&t.sel.r){
    const l=SHOP.left.find(x=>x.id===t.sel.l),r=SHOP.right.find(x=>x.id===t.sel.r);
    if(l.key===r.key){
      if(!t.found.some(p=>p[0]===l.id&&p[1]===r.id)){
        t.found.push([l.id,r.id]);t.lastFound=l.id+'-'+r.id;play('link');
        t.msg=l.val+' and '+r.val+' share key '+l.key+'.';t.mt='good';
      }
    }else{
      t.fails++;play('bad');
      t.msg=l.val+' has id '+l.key+', but that order has customer_id '+r.key+'. The keys must be equal.';t.mt='bad';
      [t.sel.l,t.sel.r].forEach(x=>{
        const e=$('#tables .row[data-id="'+x+'"]');
        if(e){e.classList.add('shake');setTimeout(()=>e.classList.remove('shake'),450);}
      });
    }
    t.sel={l:null,r:null};
  }
  updateConnect();
}
function finishConnect(){
  const t=S.t,L=LEVELS[S.level],n=starsFor(t.fails);
  t.done=true;
  S.stars[S.level]=Math.max(S.stars[S.level],n);save();
  setTimeout(()=>play('win'),350);

  $('#status').className='status good';$('#status').textContent=t.msg;
  drawLinks();renderPips();
  $('#outcomeBox').innerHTML=outcomeHTML({stars:n,title:'Keys connect the tables',text:esc(L.done),btn:'Next level'});
  scrollToOutcome();
}

function updateBuild(flip){
  const t=S.t,ds=SHOP;
  const before={};
  if(flip&&!reduce())$$('.cand').forEach(e=>{before[e.dataset.cid]=e.getBoundingClientRect();});
  const tray=t.pool.filter(c=>!t.kept.has(c.id));
  const res=Array.from(t.kept).map(id=>t.cmap[id]);
  const mkc=c=>candHTML(c,{btn:true,cls:(t.bad.has(c.id)?'bad ':'')+(t.done?'ok':''),dis:t.done,pressed:t.kept.has(c.id)});
  $('#tray').innerHTML=tray.length?tray.map(mkc).join(''):'<p class="empty">Every row has moved to the result.</p>';
  $('#result').innerHTML='<div class="res-head"><span>'+esc(ds.lt+'.'+ds.lv)+'</span><span>'+esc(ds.rt+'.'+ds.rv)+'</span></div>'+(res.length?res.map(mkc).join(''):'<p class="empty">Tap rows in the tray to add them here.</p>');
  $('#trayN').textContent=tray.length+' left';

  $('#outcomeBox').innerHTML=t.outcome||'';

    $$('.cand').forEach(e=>{

      if(Math.abs(dx)+Math.abs(dy)<2)return;

function toggleCand(el){

function clearAll(){
  const t=S.t;
  if(t.done)return;

function runBuild(){
  const t=S.t,L=LEVELS[S.level];
  if(t.done||!t.kept.size)return;
  const exp=new Set(t.pool.filter(c=>JOIN[L.type].kinds.indexOf(c.kind)>-1).map(c=>c.id));
  const extra=Array.from(t.kept).filter(id=>!exp.has(id));
  const missing=Array.from(exp).filter(id=>!t.kept.has(id));
  if(!extra.length&&!missing.length){winBuild();return;}
  t.fails++;t.bad=new Set(extra);
  const parts=[];
  if(extra.length)parts.push(extra.length+(extra.length===1?' row in your result does not belong.':' rows in your result do not belong.'));
  if(missing.length)parts.push(missing.length+(missing.length===1?' row is still missing.':' rows are still missing.'));
  t.msg=parts.join(' ');t.mt='bad';
  play('bad');
  updateBuild(false);
}
function winBuild(){
  const t=S.t,L=LEVELS[S.level],n=starsFor(t.fails),ds=SHOP;
  t.done=true;t.bad=new Set();
  S.stars[S.level]=Math.max(S.stars[S.level],n);save();
  play('win');
  t.msg='Query returned '+t.kept.size+' rows.';t.mt='good';
  const last=S.level===LEVELS.length-1;
  t.outcome=outcomeHTML({venn:venn(JOIN[L.type].on,[ds.lt,ds.rt]),stars:n,title:esc(JOIN[L.type].name)+' returned '+t.kept.size+' rows',text:esc(L.done),btn:last?'Finish':'Next level'});
  updateBuild(false);
  renderPips();
  scrollToOutcome();
}

function renderDetect(){
  const root=$('#stage'),L=LEVELS[S.level],t=S.t,R=ROUNDS[t.round],ds=R.ds;
  const all=candidates(ds);
  t.cmap={};all.forEach(c=>{t.cmap[c.id]=c;});
  const res=all.filter(c=>JOIN[R.answer].kinds.indexOf(c.kind)>-1);
  const blank='<span class="jn blank">'+(t.roundDone?JOIN[R.answer].name:'_____ JOIN')+'</span>';
  const sql=hlSQL(sqlFor(ds,R.answer,'@@BLANK@@')).replace('@@BLANK@@',blank);
  const choices=['inner','left','right','full'].map(k=>{
    const cls=t.roundDone?(k===R.answer?'right':''):(t.wrong.has(k)?'wrong':'');
    const dis=t.roundDone||t.wrong.has(k);
    return '<button type="button" class="choice '+cls+'" data-act="guess" data-join="'+k+'"'+(dis?' disabled':'')+'>'+venn(JOIN[k].on,false)+'<span>'+JOIN[k].name+'</span></button>';
  }).join('');
  const clue={inner:'No NULLs appear anywhere.',left:'NULL appears only on the right side.',right:'NULL appears only on the left side.',full:'NULL appears on both sides.'}[R.answer];
  root.innerHTML=headHTML(L,S.level,'Query',sql,'Round '+(t.round+1)+' of '+ROUNDS.length)+
    '<div class="board">'+tablesHTML(ds,false)+'</div>'+legendHTML()+
    '<div class="zone result solo"><h2><span>Result of the mystery join</span><span>'+res.length+' rows</span></h2><div class="drop" id="result"><div class="res-head"><span>'+esc(ds.lt+'.'+ds.lv)+'</span><span>'+esc(ds.rt+'.'+ds.rv)+'</span></div>'+
      res.map(c=>candHTML(c,{btn:false,cls:t.roundDone?'ok':''})).join('')+'</div></div>'+
    '<p class="q">Which join produced this result?</p><div class="choices">'+choices+'</div>'+
    '<div class="actions"><button type="button" class="btn" data-act="hint"'+(t.roundDone?' disabled':'')+'>Show a clue</button><p class="status '+t.mt+'" id="status" aria-live="polite">'+esc(t.msg)+'</p></div>'+
    '<div id="hintBox">'+(t.hint&&!t.roundDone?'<p class="hint">Clue: '+esc(clue)+'</p>':'')+'</div><div id="outcomeBox"></div>';
  if(t.roundDone){
    const lastRound=t.round===ROUNDS.length-1;
    $('#outcomeBox').innerHTML=outcomeHTML({venn:venn(JOIN[R.answer].on,[ds.lt,ds.rt]),stars:starsFor(t.fails),eyebrow:lastRound?'Detective work done':'Round solved',title:esc(JOIN[R.answer].name),text:esc(DETECT_TEXT[R.answer]),btn:lastRound?'See the cheat sheet':'Next round'});
  }
  requestAnimationFrame(drawLinks);
}
function guess(type){
  const t=S.t,R=ROUNDS[t.round];
  if(t.roundDone||t.wrong.has(type))return;
  const all=candidates(R.ds);
  const resN=all.filter(c=>JOIN[R.answer].kinds.indexOf(c.kind)>-1).length;
  if(type===R.answer){
    t.roundDone=true;t.msg='Correct.';t.mt='good';
    if(t.round===ROUNDS.length-1){
      S.stars[S.level]=Math.max(S.stars[S.level],starsFor(t.fails));save();
      play('win');renderPips();
    }else{play('link');}
    renderDetect();
    scrollToOutcome();
  }else{
    t.wrong.add(type);t.fails++;t.mt='bad';
    const n=all.filter(c=>JOIN[type].kinds.indexOf(c.kind)>-1).length;
    t.msg=n!==resN?JOIN[type].name+' would return '+n+' rows, but this result has '+resN+'.':JOIN[type].name+' also returns '+n+' rows. Check which table the unmatched row comes from.';
    play('bad');
    renderDetect();
  }
}

/* ---------- finale ---------- */
function renderFinale(){
  const root=$('#stage');
  const total=S.stars.reduce((a,b)=>a+b,0),max=LEVELS.length*3;
  root.innerHTML='<section><p class="eyebrow">All levels complete</p><h1>You can join tables</h1>'+
    '<p class="lede">Every join starts the same way. Match rows on a key, then decide what to do with the rows that found no partner. Here is the cheat sheet for the five patterns you just played.</p>'+
    '<div class="score"><span>'+total+' of '+max+' stars</span></div>'+
    '<div class="cheats">'+CHEATS.map(c=>'<div class="cheat">'+venn(JOIN[c.t].on,false)+'<h3>'+c.h+'</h3><p>'+c.p+'</p></div>').join('')+'</div>'+
    '<div class="actions"><button type="button" class="btn" data-act="restart">Start over</button><p class="status">Use the numbers at the top to replay any level and earn more stars.</p></div></section>';
}

/* ---------- flow ---------- */
function render(){
  renderPips();
  const root=$('#stage');
  if(S.level>=LEVELS.length){renderFinale();return;}
  const k=LEVELS[S.level].kind;
  if(k==='connect')renderConnect(root);
  else if(k==='build')renderBuild(root);
  else renderDetect();
  requestAnimationFrame(drawLinks);
}
function go(i){
  S.level=i;S.t=newT(i);
  render();
  window.scrollTo(0,0);
}
function next(){
  const L=LEVELS[S.level],t=S.t;
  if(L&&L.kind==='detect'){
    if(t.round<ROUNDS.length-1){
      t.round++;t.roundDone=false;t.wrong=new Set();t.msg='';t.mt='';t.hint=false;t.anim=true;
      renderDetect();window.scrollTo(0,0);
    }else{go(LEVELS.length);}
    return;
  }
  go(S.level+1);
}
function restart(){
  S.stars=LEVELS.map(()=>0);save();go(0);
}
function showHint(){
  const t=S.t;
  t.hint=!t.hint;
  const L=LEVELS[S.level];
  if(L.kind==='connect')updateConnect();
  else if(L.kind==='build')updateBuild(false);
  else renderDetect();
}
function scrollToOutcome(){
  setTimeout(()=>{
    const o=$('#outcomeBox');
    if(o&&o.firstElementChild)o.scrollIntoView({behavior:reduce()?'auto':'smooth',block:'nearest'});
  },60);
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el||el.disabled)return;
  const a=el.dataset.act;
  if(a==='pick')pick(el);
  else if(a==='toggle')toggleCand(el);
  else if(a==='run')runBuild();
  else if(a==='hint')showHint();
  else if(a==='clear')clearAll();
  else if(a==='next')next();
  else if(a==='guess')guess(el.dataset.join);
  else if(a==='restart')restart();
  else if(a==='sound')toggleSound();
  else if(a==='pip'){play('tap');go(+el.dataset.i);}
});
document.addEventListener('mouseover',e=>{
  const c=e.target.closest&&e.target.closest('.cand');
  if(c){clearTimeout(S.hlT);setHL(c.dataset.cid);}
});
document.addEventListener('mouseout',e=>{
  const c=e.target.closest&&e.target.closest('.cand');
  if(c&&!c.contains(e.relatedTarget))clearHL();
});
document.addEventListener('focusin',e=>{
  const c=e.target.closest&&e.target.closest('.cand');
  if(c)setHL(c.dataset.cid);
});
document.addEventListener('focusout',e=>{
  const c=e.target.closest&&e.target.closest('.cand');
  if(c)clearHL();
});
window.addEventListener('resize',drawLinks);
if(window.ResizeObserver){new ResizeObserver(()=>drawLinks()).observe($('#stage'));}
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(drawLinks);}

function start(data){
  load();
  paintSound();
  let lv=S.stars.findIndex(x=>!x);
  if(lv===-1)lv=LEVELS.length;
  if(data&&typeof data.level==='number'&&data.level>=0&&data.level<=lv)lv=data.level;
  go(lv);
  try{
    if(window.claude&&window.claude.hot&&window.claude.hot.snapshot){
      window.claude.hot.snapshot(()=>({level:S.level}));
    }
  }catch(e){}
}
try{
  if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);
  else start((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
}catch(e){start({});}
})();
</script>

</body></html>
