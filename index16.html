<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aquarium Adventure</title>

<style>
:root{
    --text:#fff;
    --muted:#c3dce8;
    --accent:#55e4ff;
    --panel:rgba(2,25,42,.58);
    --border:rgba(255,255,255,.2);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    min-height:100%;
}

body{
    min-height:100vh;
    overflow-x:hidden;
    color:var(--text);
    font-family:"Segoe UI",Arial,sans-serif;
    background:#063d62;
    transition:background 1s ease;
}

/* =====================================================
   OCEAN BACKGROUND
===================================================== */

.ocean{
    position:fixed;
    inset:0;
    overflow:hidden;
    z-index:-10;
    background:
        linear-gradient(
            180deg,
            #51c9f0 0%,
            #087ca8 25%,
            #034b70 55%,
            #021d31 100%
        );
    transition:filter 1s ease,background 1s ease;
}

/* Sunlight */

.sun-rays{
    position:absolute;
    inset:-20%;
    background:
        conic-gradient(
            from 180deg at 50% 0%,
            transparent 0deg,
            rgba(255,255,255,.16) 12deg,
            transparent 25deg,
            rgba(255,255,255,.10) 42deg,
            transparent 55deg,
            rgba(255,255,255,.12) 72deg,
            transparent 90deg
        );
    filter:blur(15px);
    opacity:.8;
    animation:sunMove 12s ease-in-out infinite alternate;
}

@keyframes sunMove{
    from{
        transform:translateX(-3%) rotate(-2deg);
    }
    to{
        transform:translateX(3%) rotate(2deg);
    }
}

/* Moving surface */

.surface{
    position:absolute;
    top:-5%;
    left:-10%;
    width:120%;
    height:180px;

    background:
        repeating-radial-gradient(
            ellipse at 50% 100%,
            rgba(255,255,255,.24) 0 2px,
            transparent 3px 14px
        );

    opacity:.42;
    filter:blur(2px);

    animation:
        surfaceMove 7s linear infinite;
}

@keyframes surfaceMove{
    from{
        transform:translateX(-2%);
    }
    to{
        transform:translateX(2%);
    }
}

/* Water caustics */

.caustics{
    position:absolute;
    inset:0;

    background-image:
        repeating-linear-gradient(
            115deg,
            transparent 0 34px,
            rgba(255,255,255,.045) 35px 37px,
            transparent 38px 70px
        );

    mix-blend-mode:screen;
    opacity:.5;

    animation:
        causticMove 10s linear infinite;
}

@keyframes causticMove{
    0%{
        transform:
            translate3d(-3%,-2%,0)
            scale(1.05);
    }

    50%{
        transform:
            translate3d(3%,2%,0)
            scale(1.1);
    }

    100%{
        transform:
            translate3d(-3%,-2%,0)
            scale(1.05);
    }
}

/* Depth haze */

.depth{
    position:absolute;
    inset:0;

    background:
        radial-gradient(
            ellipse at 50% 25%,
            transparent 0 20%,
            rgba(0,20,35,.18) 55%,
            rgba(0,5,15,.62) 100%
        );
}

/* Bubbles */

.bubbles{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.bubble{
    position:absolute;
    bottom:-80px;

    width:
        var(--size);

    height:
        var(--size);

    border:
        1px solid
        rgba(255,255,255,.55);

    border-radius:50%;

    background:
        radial-gradient(
            circle at 30% 25%,
            rgba(255,255,255,.75),
            rgba(255,255,255,.08) 35%,
            transparent 65%
        );

    animation:
        bubbleRise
        var(--duration)
        linear
        infinite;

    animation-delay:
        var(--delay);
}

@keyframes bubbleRise{

    0%{
        transform:
            translate3d(0,0,0)
            scale(.8);

        opacity:0;
    }

    10%{
        opacity:.7;
    }

    50%{
        transform:
            translate3d(
                var(--drift),
                -50vh,
                0
            )
            scale(1);
    }

    100%{
        transform:
            translate3d(
                calc(var(--drift) * -1),
                -115vh,
                0
            )
            scale(1.15);

        opacity:0;
    }
}

/* =====================================================
   NIGHT MODE
===================================================== */

body.night .ocean{

    background:
        linear-gradient(
            180deg,
            #06172d 0%,
            #031329 30%,
            #020b19 65%,
            #01050d 100%
        );

    filter:
        saturate(.75)
        brightness(.58);
}

body.night .sun-rays{
    opacity:.12;
}

body.night .caustics{
    opacity:.18;
}

body.night .depth{
    background:
        radial-gradient(
            circle at 50% 30%,
            rgba(45,110,170,.12),
            rgba(0,0,0,.72) 75%
        );
}

/* Moon */

.moon{
    position:absolute;

    top:8%;
    right:10%;

    width:85px;
    height:85px;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 35%,
            #fff,
            #d9eaff 65%,
            #8ca9c8
        );

    box-shadow:
        0 0 45px
        rgba(190,225,255,.55);

    opacity:0;

    transition:
        opacity 1s ease;
}

body.night .moon{
    opacity:1;
}

/* =====================================================
   PAGE
===================================================== */

.page{
    width:min(1180px,94%);
    margin:auto;
    padding:35px 0 55px;
}

/* =====================================================
   HEADER
===================================================== */

header{
    text-align:center;
    margin-bottom:30px;
}

.kicker{
    color:var(--accent);
    font-size:12px;
    font-weight:800;
    letter-spacing:4px;
    text-transform:uppercase;
}

h1{
    font-size:
        clamp(
            35px,
            6vw,
            65px
        );

    line-height:1;
    margin:10px 0;
    text-shadow:
        0 5px 30px
        rgba(0,0,0,.5);
}

header p{
    color:var(--muted);
    font-size:16px;
}

/* =====================================================
   CONTROLS
===================================================== */

.controls{
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
    margin:25px auto 32px;
}

.control{
    border:1px solid var(--border);
    border-radius:999px;
    padding:11px 18px;

    color:white;

    background:
        rgba(0,20,35,.55);

    backdrop-filter:
        blur(12px);

    cursor:pointer;

    font-size:13px;
    font-weight:800;

    transition:
        transform .2s ease,
        background .3s ease,
        border-color .3s ease;
}

.control:hover{
    transform:translateY(-2px);
    border-color:var(--accent);
}

.control.active{
    background:
        rgba(67,217,255,.2);

    border-color:
        var(--accent);

    box-shadow:
        0 0 20px
        rgba(67,217,255,.12);
}

/* =====================================================
   FISH GRID
===================================================== */

.fish-grid{
    display:grid;

    grid-template-columns:
        repeat(5,1fr);

    gap:18px;
}

/* =====================================================
   FISH CARD
===================================================== */

.fish-card{
    position:relative;
    overflow:hidden;

    border:
        1px solid
        rgba(255,255,255,.18);

    border-radius:22px;

    background:
        rgba(1,25,42,.56);

    backdrop-filter:
        blur(10px);

    box-shadow:
        0 18px 45px
        rgba(0,0,0,.35);

    cursor:pointer;

    transition:
        transform .3s ease,
        box-shadow .3s ease,
        border-color .3s ease;
}

.fish-card:hover{
    transform:
        translateY(-8px)
        scale(1.01);

    border-color:
        rgba(67,217,255,.8);

    box-shadow:
        0 28px 65px
        rgba(0,0,0,.5),
        0 0 30px
        rgba(67,217,255,.12);
}

.fish-card img{
    display:block;

    width:100%;
    height:205px;

    object-fit:cover;

    transition:
        transform .5s ease;
}

.fish-card:hover img{
    transform:scale(1.07);
}

.fish-info{
    padding:16px;
}

.fish-info h2{
    font-size:19px;
    margin-bottom:5px;
}

.fish-info p{
    color:#a8cbd9;
    font-size:12px;
}

/* =====================================================
   MODAL
===================================================== */

.modal{
    position:fixed;
    inset:0;

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;

    z-index:100;

    background:
        rgba(0,8,15,.82);

    backdrop-filter:
        blur(9px);
}

.modal.open{
    display:flex;
}

.modal-card{
    width:min(720px,100%);

    overflow:hidden;

    border:
        1px solid
        rgba(255,255,255,.2);

    border-radius:28px;

    background:
        linear-gradient(
            145deg,
            #092d43,
            #031521
        );

    box-shadow:
        0 35px 100px
        rgba(0,0,0,.7);

    animation:
        modalIn .3s ease;
}

@keyframes modalIn{

    from{
        opacity:0;
        transform:
            translateY(20px)
            scale(.97);
    }

    to{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
    }
}

.modal-card img{
    width:100%;
    height:min(430px,55vh);

    display:block;

    object-fit:cover;
}

.modal-content{
    padding:25px;
}

.modal-content h2{
    font-size:31px;
    margin-bottom:10px;
}

.modal-content p{
    color:#b9d4e2;
    line-height:1.7;
}

.close{
    margin-top:20px;

    padding:12px 23px;

    border:0;
    border-radius:12px;

    background:
        linear-gradient(
            135deg,
            #55e4ff,
            #079bc9
        );

    color:#032033;

    font-weight:800;

    cursor:pointer;
}

/* =====================================================
   FOOTER
===================================================== */

footer{
    text-align:center;

    margin-top:35px;

    color:#78a9bd;

    font-size:10px;

    letter-spacing:2px;

    text-transform:uppercase;
}

/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:1000px){

    .fish-grid{
        grid-template-columns:
            repeat(4,1fr);
    }
}

@media(max-width:800px){

    .fish-grid{
        grid-template-columns:
            repeat(3,1fr);
    }
}

@media(max-width:600px){

    .page{
        width:92%;
        padding-top:25px;
    }

    .fish-grid{
        grid-template-columns:
            repeat(2,1fr);

        gap:13px;
    }

    .fish-card img{
        height:165px;
    }

}

@media(max-width:420px){

    .fish-grid{
        grid-template-columns:1fr;
    }

    .fish-card img{
        height:220px;
    }

}

</style>
</head>

<body>

<!-- =====================================================
     OCEAN ENVIRONMENT
===================================================== -->

<div class="ocean">

    <div class="sun-rays"></div>

    <div class="surface"></div>

    <div class="caustics"></div>

    <div class="depth"></div>

    <div class="moon"></div>

    <div class="bubbles">

        <span class="bubble"
              style="--size:12px;--duration:8s;--delay:0s;--drift:70px;left:8%;"></span>

        <span class="bubble"
              style="--size:20px;--duration:11s;--delay:2s;--drift:-80px;left:20%;"></span>

        <span class="bubble"
              style="--size:9px;--duration:7s;--delay:1s;--drift:90px;left:34%;"></span>

        <span class="bubble"
              style="--size:16px;--duration:10s;--delay:4s;--drift:-60px;left:48%;"></span>

        <span class="bubble"
              style="--size:24px;--duration:13s;--delay:3s;--drift:70px;left:63%;"></span>

        <span class="bubble"
              style="--size:11px;--duration:9s;--delay:5s;--drift:-90px;left:78%;"></span>

        <span class="bubble"
              style="--size:18px;--duration:12s;--delay:6s;--drift:55px;left:91%;"></span>

    </div>

</div>


<div class="page">

<header>
<p>
    <a href=" https://janicej637.github.io/" style="color: #000080;"><img src="https://clipart-library.com/data_images/469756.png" alt="Home" width="80" height="30"> </a>
  </p>
    <div class="kicker">
        Explore • Discover • Learn
    </div>

    <h1>
        Aquarium Adventure
    </h1>

    <p>
        Dive into a living ocean and explore amazing fish.
    </p>

</header>


<!-- =====================================================
     CONTROLS
===================================================== -->

<div class="controls">

    <button
        id="dayToggle"
        class="control active"
        type="button"
    >
        ☀️ Day
    </button>

    <button
        id="nightToggle"
        class="control"
        type="button"
    >
        🌙 Night
    </button>

    <button
        id="soundToggle"
        class="control"
        type="button"
    >
        🔇 Ocean Sounds
    </button>

</div>


<!-- =====================================================
     FISH
===================================================== -->

<main
    id="fish-grid"
    class="fish-grid"
></main>


<footer>
    Aquarium Adventure • Explore the Ocean
</footer>

</div>


<!-- =====================================================
     MODAL
===================================================== -->

<div
    id="modal"
    class="modal"
    aria-hidden="true"
>

    <div class="modal-card">

        <img
            id="modal-image"
            src=""
            alt=""
        >

        <div class="modal-content">

            <h2
                id="modal-name"
            ></h2>

            <p
                id="modal-facts"
            ></p>

            <button
                id="close-modal"
                class="close"
                type="button"
            >
                Close
            </button>

        </div>

    </div>

</div>


<script src="main8.js"></script>

</body>
</html>
