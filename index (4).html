<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CISC 0681 | Modern 3D Avatar Lab</title>
    <!-- Tailwind CSS CDN for a clean dark-mode developer UI -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0a0e17;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        #container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        /* Custom styling override for lil-gui to blend into our modern interface seamlessly */
        .lil-gui {
            --background-color: rgba(15, 23, 42, 0.85) !important;
            --text-color: #e2e8f0 !important;
            --title-background-color: rgba(30, 41, 59, 0.9) !important;
            --widget-color: #334155 !important;
            --hover-color: #475569 !important;
            --focus-color: #6366f1 !important;
            font-family: monospace !important;
            border-radius: 12px !important;
            overflow: hidden !important;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.5) !important;
            border: 1px solid rgba(51, 65, 85, 0.5) !important;
            backdrop-filter: blur(12px) !important;
        }
    </style>
</head>
<body>

    <!-- WebGL Canvas Container -->
    <div id="container"></div>

    <!-- Minimal HUD Interface -->
    <div class="absolute top-0 left-0 w-full h-full pointer-events-none z-10 flex flex-col justify-between p-6">
        <!-- Dashboard Header -->
        <header class="pointer-events-auto bg-slate-900/80 backdrop-blur-md border border-slate-800 rounded-2xl p-4 shadow-2xl max-w-sm flex items-center justify-between transition-all duration-300 hover:border-indigo-500/50">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white shadow-md shadow-indigo-500/20">3D</div>
                <div>
                    <h1 class="text-slate-200 font-bold tracking-wide text-xs m-0 uppercase">Graphics Sandbox</h1>
                    <p class="text-indigo-400 font-mono text-[10px] mt-0.5">LOADED: avatar2.js</p>
                </div>
            </div>
            <span class="flex h-2 w-2 relative">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-indigo-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-2 w-2 bg-indigo-500"></span>
            </span>
        </header>

        <!-- Dynamic User Interaction Hints -->
        <footer class="pointer-events-auto bg-slate-900/70 backdrop-blur-md border border-slate-800/60 rounded-xl px-4 py-2.5 text-center font-mono text-[10px] text-slate-400 self-center shadow-xl tracking-wider uppercase border-b-2 border-b-indigo-500">
            [Left-Click + Drag] Orbit • [Scroll] Zoom • [Right-Click + Drag] Pan
        </footer>
    </div>

    <!-- Modular Script Imports using Native Browser Import Maps -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <!-- Main Module Loading Layer -->
    <script type="module" src="./avatar2.js"></script>

</body>
</html>
